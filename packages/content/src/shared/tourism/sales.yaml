events:
  - id: platform_ranking_drop
    area: sales
    weight: 2
    once: false
    cooldownWeeks: 16
    when: [tour.listed == 1, tour.rating < 42, tour.reviews >= 5]
    from: none
    sender: Platform analytics
    look: official
    text: >-
      The platform's monthly report says your listing slipped down the rankings. Better reviews
      would help, the report says, as if you had not thought of that. Asking works best with
      guests in front of you.
    defaultChoice: ignore
    choices:
      - id: ask_reviews
        label: Ask happy guests for reviews
        hours: 2
        effects:
          - { type: review, rating: 5, count: 2, when: [tour.bookedWeek >= 3] }
      - id: ignore
        label: Ignore the report
        hours: 0

  - id: platform_fee_change
    area: sales
    weight: 2
    once: true
    when: [tour.listed == 1, week >= 30]
    from: none
    sender: Platform partner team
    look: official
    text: >-
      The platform introduces a "service fee" for partners, effective next month. The letter
      thanks you for growing together, though only one of you is growing.
    defaultChoice: accept
    choices:
      - id: complain
        label: Write a firm complaint
        hours: 1
        effects:
          - { type: energy, delta: 2 }
          - { type: fixedCost, id: platform_fee, name: Platform service fee, monthlyCents: 4000 }
      - id: accept
        label: Accept it
        hours: 0
        effects:
          - { type: fixedCost, id: platform_fee, name: Platform service fee, monthlyCents: 4000 }

  - id: repeat_guest_thanks
    area: sales
    weight: 2
    once: false
    cooldownWeeks: 14
    when: [tour.reviews >= 15, tour.rating >= 42]
    from: none
    sender: A returning guest
    look: note
    text: >-
      A guest who came last month is back with friends and asks whether there is a discount for
      bringing people. There is, if you say so now.
    defaultChoice: no
    choices:
      - id: discount
        label: Give the group a small discount
        hours: 0
        effects:
          - { type: cash, amountCents: -5000 }
          - { type: guests, count: 6 }
      - id: no
        label: Thank them and keep prices
        hours: 0

  - id: tourism_fair
    area: sales
    weight: 1
    once: true
    when: [week >= 40]
    from: none
    sender: A regional tourism fair
    text: >-
      A regional tourism fair offers a small stand for two days. Lots of brochures, lots of coffee,
      and a few people who actually book things. Visitors take a brochure and check your reviews on
      the train home.
    defaultChoice: skip
    choices:
      - id: stand
        label: Book a stand
        hours: 12
        effects:
          - { type: cash, amountCents: -40000 }
          - { type: guests, count: 10, when: [tour.rating >= 40] }
          - { type: energy, delta: -5 }
      - id: skip
        label: Skip it
        hours: 0

  - id: review_reply_bad
    area: sales
    weight: 2
    once: false
    cooldownWeeks: 18
    when: [tour.reviews >= 8, tour.rating < 38]
    from: none
    sender: A guest review
    look: note
    text: >-
      A guest writes that the service felt rushed and the staff overworked. Both are true, which
      is the worst kind of review to answer.
    defaultChoice: ignore
    choices:
      - id: apologise
        label: Apologise and invite them back
        hours: 1
        effects:
          - { type: review, rating: 4, count: 1 }
      - id: ignore
        label: Ignore it
        hours: 0
        effects:
          - { type: review, rating: 2, count: 1 }

  # Plan 2 step 3: the effortful answer pays only in the situation the text names.
  - id: photo_shoot
    area: sales
    weight: 2
    once: true
    when: [week >= 6]
    from: none
    sender: A photographer
    text: >-
      A photographer offers a day's shoot for 600 EUR: guests enjoying themselves, the view at its
      best. In a busy peak week the guests in the pictures post them for you. In a quiet month you
      get lovely photos of empty chairs.
    defaultChoice: decline
    choices:
      - id: shoot
        label: Book the shoot
        hours: 5
        effects:
          - { type: cash, amountCents: -60000 }
          - { type: energy, delta: -3 }
          - { type: review, rating: 5, count: 4, when: [tour.peak == 1] }
      - id: decline
        label: Not now
        hours: 0

  - id: guidebook_page
    area: sales
    weight: 2
    once: true
    when: [week >= 10]
    from: none
    sender: A guidebook editor
    text: >-
      A guidebook editor asks for a page of text about your place, written by you, by Friday. They
      print only places rated 4.2 or better; below that, your page goes into a drawer and stays
      there.
    defaultChoice: decline
    choices:
      - id: write
        label: Write the page
        hours: 5
        effects:
          - { type: energy, delta: -3 }
          - { type: review, rating: 5, count: 4, when: [tour.rating >= 42] }
      - id: decline
        label: Decline politely
        hours: 0

  - id: tasting_evening
    area: sales
    weight: 2
    once: true
    when: [week >= 8]
    from: none
    sender: The village association
    text: >-
      The village association suggests a tasting evening for locals, ingredients 400 EUR on you.
      Off season the neighbours have time and talk about you all winter. In season they are busy
      renting out their spare rooms.
    defaultChoice: decline
    choices:
      - id: host
        label: Host the evening
        hours: 6
        effects:
          - { type: cash, amountCents: -40000 }
          - { type: energy, delta: -4 }
          - { type: review, rating: 5, count: 4, when: [tour.peak == 0] }
      - id: decline
        label: Not this year
        hours: 0
