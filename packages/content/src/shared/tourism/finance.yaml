events:
  - id: tax_advance_tourism
    area: finance
    weight: 2
    once: true
    when: [week >= 30]
    from: none
    sender: Tax office
    look: official
    text: >-
      The tax office sets an advance payment based on your best month, as if every month were
      August. Objecting works if your recent months look quiet; in a busy one, the tax office
      agrees with itself.
    defaultChoice: pay
    choices:
      - id: object
        label: Object with your monthly figures
        hours: 3
        effects:
          - { type: cash, amountCents: 60000, when: [monthlyRevenueEur < 4000] }
          - { type: cash, amountCents: -60000, when: [monthlyRevenueEur >= 4000] }
      - id: pay
        label: Pay it
        hours: 0
        effects:
          - { type: cash, amountCents: -60000 }

  - id: bank_card_terminal
    area: finance
    weight: 1
    once: true
    when: [week >= 5]
    from: none
    sender: Your bank
    text: >-
      Your bank offers a card terminal with a lower fee if you sign for two years. Guests like
      paying by card; you like it less when you read the small print.
    defaultChoice: decline
    choices:
      - id: sign
        label: Sign for the terminal
        hours: 1
        effects:
          - { type: fixedCost, id: card_terminal, name: Card terminal, monthlyCents: 2500 }
          - { type: guests, count: 3 }
      - id: decline
        label: Keep the old one
        hours: 0

  - id: energy_bill
    area: finance
    weight: 2
    once: true
    when: [tour.month == 1]
    from: none
    sender: The utility company
    look: official
    text: >-
      The winter energy bill arrives with a backdated adjustment. The letter calls it a
      correction; your bank calls it a shock.
    defaultChoice: pay
    choices:
      - id: plan
        label: Agree a payment plan
        hours: 1
        effects:
          - { type: fixedCost, id: energy_plan, name: Energy payment plan, monthlyCents: 8000 }
      - id: pay
        label: Pay it now
        hours: 0
        effects:
          - { type: cash, amountCents: -45000 }

  # Plan 2 step 3: the effortful answer pays only in the situation the text names.
  - id: energy_audit
    area: finance
    weight: 2
    once: true
    when: [week >= 6]
    from: none
    sender: An energy consultant
    text: >-
      An energy consultant offers an audit for 400 EUR and an afternoon of your time. The savings
      come in the cold months, about 1,200 EUR of them. Booked in season, the report arrives after
      the heating is off and is forgotten by autumn.
    defaultChoice: decline
    choices:
      - id: audit
        label: Book the audit
        hours: 4
        effects:
          - { type: cash, amountCents: -40000 }
          - { type: cash, amountCents: 120000, when: [tour.peak == 0] }
      - id: decline
        label: Not now
        hours: 0

  - id: tax_seminar
    area: finance
    weight: 2
    once: true
    when: [week >= 12]
    from: none
    sender: The chamber of commerce
    look: official
    text: >-
      The chamber runs a seminar on cash planning for small businesses, 250 EUR and a day. It pays
      for itself only if money is already tight: the trainer finds a few months of quiet payments
      you can move. With plenty in the bank it is a long day of slides.
    defaultChoice: decline
    choices:
      - id: attend
        label: Attend the seminar
        hours: 6
        effects:
          - { type: cash, amountCents: -25000 }
          - { type: energy, delta: -3 }
          - { type: cash, amountCents: 150000, when: [runwayWeeks < 12] }
      - id: decline
        label: Skip it
        hours: 0
