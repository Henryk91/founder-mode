# Events every tourism scenario shares (step 5). Nothing here names a scenario's products.
events:
  - id: local_newspaper_feature
    area: validation
    weight: 1
    once: true
    when: [week >= 10]
    from: none
    sender: The local paper
    text: >-
      The local paper wants to feature "a young business in the area". The photographer will
      come on Tuesday and wants you to look relaxed, which costs extra.
    defaultChoice: decline
    choices:
      - id: interview
        label: Do the interview and the photo
        hours: 2
        effects:
          - { type: guests, count: 4 }
      - id: decline
        label: Decline
        hours: 0

  - id: guest_survey_cards
    area: validation
    weight: 2
    once: true
    when: [tour.reviews >= 5]
    from: none
    sender: Your own idea
    look: note
    text: >-
      You could leave little feedback cards with every guest. Some will write lovely things,
      some will draw, and a few will tell you the truth.
    defaultChoice: skip
    choices:
      - id: cards
        label: Print cards and read them every week
        hours: 2
        effects:
          - { type: skill, skill: interviewing, delta: 0.03 }
      - id: skip
        label: Skip it
        hours: 0

  - id: competitor_visit
    area: validation
    weight: 1
    once: true
    when: [week >= 6]
    from: none
    sender: A friend
    look: note
    text: >-
      A friend suggests you book a competitor's offer as a guest and watch what they do. Spying,
      she calls it research; your conscience calls it a day out.
    defaultChoice: skip
    choices:
      - id: go
        label: Book it and take notes
        hours: 6
        effects:
          - { type: cash, amountCents: -9000 }
          - { type: skill, skill: selling, delta: 0.03 }
      - id: skip
        label: Skip it
        hours: 0
