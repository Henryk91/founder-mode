# Inbox events shared by every scenario, product area. Same format as a scenario's events
# files. Nothing here may name a scenario's product, markets or features. A scenario places a
# shared event in its own list with `- shared: <id>`; shared events it does not place come after
# its own, in this order.
events:
  - id: security_notice
    area: product
    weight: 2
    once: true
    when: [features.shipped >= 1]
    from: none
    sender: Forum thread
    text: >-
      A forum thread says a library you rely on has a security notice. Fixing it takes an
      afternoon. Not fixing it takes longer, later, once there are customers to annoy.
    defaultChoice: ignore
    choices:
      - id: patch
        label: Patch it now
        hours: 4
      - id: ignore
        label: Read it again tomorrow
        hours: 0
        effects:
          - { type: bugs, delta: 2, when: [customers.count >= 1] }

  - id: hosting_pricing
    area: product
    weight: 1
    once: true
    when: [week >= 3]
    from: none
    sender: Hosting provider
    look: official
    text: >-
      Your hosting provider has changed its pricing. The new price is higher. The old plan is now
      described as "legacy".
    defaultChoice: accept
    choices:
      - id: migrate
        label: Migrate it yourself
        hours: 6
      - id: accept
        label: Accept the new price
        hours: 0
        effects:
          - { type: fixedCost, id: hosting_upgrade, name: Hosting upgrade, monthlyCents: 3000 }

  - id: missing_backups
    area: product
    weight: 2
    once: true
    when: [features.shipped >= 2]
    from: none
    sender: Your conscience
    look: note
    text: >-
      You realise the database has not been backed up since the day you set it up. Nothing has
      gone wrong. Nothing has gone wrong yet.
    defaultChoice: later
    choices:
      - id: backup
        label: Set up backups
        hours: 2
      - id: later
        label: Later, surely
        hours: 0
        effects:
          - { type: bugs, delta: 3, chance: 0.25 }
          - { type: lostHours, hours: 6, chance: 0.25 }

  - id: framework_upgrade
    area: product
    weight: 2
    once: true
    when: [features.shipped >= 1, week >= 6]
    from: none
    sender: Release notes
    text: >-
      The framework you use has a new major version. The release notes say upgrading is easy,
      in a tone that suggests otherwise.
    defaultChoice: stay
    choices:
      - id: upgrade
        label: Upgrade now
        hours: 6
        effects:
          - { type: bugs, delta: 2, chance: 0.5 }
      - id: stay
        label: Stay on the old one
        hours: 0

  - id: bounty_hunter
    area: product
    weight: 2
    once: true
    when: [features.shipped >= 1]
    from: none
    sender: Security researcher
    text: >-
      A stranger reports a security hole and asks for a bug bounty of 150 EUR. The hole is
      real. The stranger's name is probably not. Until someone pays you, there is nothing
      behind the hole worth taking.
    defaultChoice: ignore
    choices:
      - id: pay
        label: Pay and fix it
        hours: 1
        effects:
          - { type: cash, amountCents: -15000 }
      - id: fix
        label: Fix it yourself
        hours: 3
      - id: ignore
        label: Ignore it
        hours: 0
        effects:
          - { type: bugs, delta: 2, when: [customers.count >= 1] }

  - id: bug_weekend
    area: product
    weight: 2
    once: true
    when: [bugs >= 3]
    from: none
    sender: Your bug list
    look: note
    text: >-
      Your bug list is now long enough to need a table of contents. A focused day would clear
      the worst of it, which matters most to the people who pay you.
    defaultChoice: carry_on
    choices:
      - id: sprint
        label: Spend a day on bugs
        hours: 6
        effects:
          - { type: bugs, delta: -3 }
      - id: carry_on
        label: Carry on
        hours: 0

  - id: unused_feature
    area: product
    weight: 2
    once: true
    when: [features.shipped >= 3]
    from: none
    sender: Usage statistics
    text: >-
      Nobody has used one of your features in five weeks. You remember building it. You
      remember it fondly. If the bug list is long, some of it probably lives in there.
    defaultChoice: keep
    choices:
      - id: remove
        label: Remove it
        hours: 2
        effects:
          - { type: bugs, delta: -1, when: [bugs >= 3] }
      - id: keep
        label: Keep it for sentimental reasons
        hours: 0

  - id: uptime_monitor
    area: product
    weight: 2
    once: true
    when: [features.shipped >= 1]
    from: none
    sender: Monitoring service
    look: official
    text: >-
      A monitoring service offers outage alerts for 15 EUR a month. Without it you hear about
      outages from customers, who are faster but less polite. With few customers, there is
      hardly anyone to hear it from.
    defaultChoice: skip
    choices:
      - id: subscribe
        label: Subscribe
        hours: 1
        effects:
          - { type: fixedCost, id: monitoring, name: Uptime monitoring, monthlyCents: 1500 }
      - id: skip
        label: Skip it
        hours: 0
        effects:
          - { type: lostHours, hours: 4, chance: 0.5, when: [customers.count >= 3] }
