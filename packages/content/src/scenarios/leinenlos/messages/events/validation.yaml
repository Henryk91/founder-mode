# Learning who books: past customers, agents and organisers.
events:
  - id: agent_breakfast
    area: validation
    weight: 2
    once: true
    when: [week >= 2, week <= 14]
    from: none
    sender: A travel agents' association
    text: >-
      The travel agents' association in Munich holds a breakfast in February. Agents who sell the
      Turkish coast will be there, and so will the croissants.
    defaultChoice: later
    choices:
      - id: go
        label: Fly over for the breakfast
        hours: 8
        effects:
          - { type: skill, skill: interviewing, delta: 0.03 }
          - { type: cash, amountCents: -40000 }
      - id: later
        label: Not this year
        hours: 0

  - id: yoga_forum
    area: validation
    weight: 1
    once: true
    when: [week >= 3, week <= 20]
    from: none
    sender: A yoga teachers' forum
    look: note
    text: >-
      A forum for yoga teachers asks who has run a retreat on a boat. You could answer, ask a few
      questions of your own and listen to a lot about mats.
    defaultChoice: lurk
    choices:
      - id: ask
        label: Ask your questions
        hours: 3
        effects:
          - { type: skill, skill: interviewing, delta: 0.02 }
      - id: lurk
        label: Read and say nothing
        hours: 0

  - id: broker_coffee
    area: validation
    weight: 1
    once: true
    when: [week >= 4, week <= 24]
    from: none
    sender: A charter broker in Göcek
    look: note
    text: >-
      A charter broker in Göcek will tell you over coffee which families charter, when and for what.
      He talks a lot and pays for nothing.
    defaultChoice: later
    choices:
      - id: coffee
        label: Have the coffee
        hours: 3
        effects:
          - { type: skill, skill: interviewing, delta: 0.02 }
      - id: later
        label: Later
        hours: 0

  # Tuning 1: the winter's selling months.
  - id: retreat_scout_visit
    area: validation
    weight: 2
    once: true
    when: [week >= 6, week <= 26]
    from: none
    sender: A hiking guide from Innsbruck
    text: >-
      A hiking guide wants to see a boat before she books a May retreat. The gulets are under
      covers and the captains are in Antalya. Showing her round takes a day and a long lunch.
    defaultChoice: decline
    choices:
      - id: show
        label: Show her round
        hours: 8
        effects:
          - { type: cash, amountCents: -15000 }
          - { type: guests, segment: retreats, count: 14, when: [shipped.retreat_setup == 1] }
      - id: decline
        label: Send photos instead
        hours: 0
