# Getting guests: platforms, firms, planners and the village's own calendar.
events:
  - id: preferred_partner_badge
    area: sales
    weight: 2
    once: true
    when: [tour.listed == 1, tour.reviews >= 10]
    from: none
    sender: Zimmerfrei
    look: official
    text: >-
      Zimmerfrei offers you a "preferred partner" badge: higher in the search, for three points
      more commission on every booking. The badge is gold. The commission is permanent.
    defaultChoice: decline
    choices:
      - id: accept
        label: Take the badge
        hours: 1
        effects:
          - { type: guests, segment: leisure, count: 15 }
          - {
              type: fixedCost,
              id: platform_badge,
              name: Preferred partner commission,
              monthlyCents: 40000,
            }
      - id: decline
        label: Decline
        hours: 0

  - id: firm_block_booking
    area: sales
    weight: 2
    once: true
    when: [week >= 10]
    from: none
    sender: A machine works up the valley
    text: >-
      A firm wants six rooms for eight weeks at a fixed low rate for a project team. It is
      guaranteed occupancy in a quiet season. In summer the same rooms would sell for more on a
      weekend. Out of season the rooms would stand empty otherwise.
    defaultChoice: decline
    choices:
      - id: accept
        label: Take the block booking
        hours: 2
        effects:
          - { type: guests, segment: project_guests, count: 30, when: [tour.peak == 0] }
          - { type: review, rating: 3, count: 2, when: [tour.peak == 1] }
      - id: decline
        label: Decline
        hours: 0

  - id: village_festival
    area: sales
    weight: 3
    once: true
    when: [tour.month == 6]
    from: none
    sender: The village
    look: note
    text: >-
      The village holds its summer festival on your best weekend: brass bands, a regatta and a
      beer tent the size of a hangar. Every bed within ten kilometres will be wanted. A full house
      that weekend needs every hand you have.
    defaultChoice: usual
    choices:
      - id: push
        label: Advertise and staff up for the weekend
        hours: 6
        effects:
          - { type: guests, segment: leisure, count: 20 }
          - { type: energy, delta: -4 }
      - id: usual
        label: Take what comes
        hours: 0

  - id: boat_package
    area: sales
    weight: 1
    once: true
    when: [week >= 16]
    from: none
    sender: The tourism office
    text: >-
      The tourism office asks you to join a package with the boat company: a night, breakfast and a
      cruise. The office takes a commission, the boat takes a cut, and guests take photos. The boats
      run in the summer months only.
    defaultChoice: decline
    choices:
      - id: join
        label: Join the package
        hours: 2
        effects:
          - { type: guests, segment: leisure, count: 10, when: [tour.peak == 1] }
          - { type: cash, amountCents: -15000 }
      - id: decline
        label: Decline
        hours: 0

  - id: twelve_room_cancel
    area: sales
    weight: 2
    once: true
    when: [tour.listed == 1, tour.reviews >= 5]
    from: none
    sender: Zimmerfrei
    look: official
    text: >-
      Someone booked all twelve rooms for one Saturday through the platform, then cancelled free
      on Friday. You turned away a wedding enquiry for that date. Your cancellation terms allowed
      it; your patience did not.
    defaultChoice: accept
    choices:
      - id: complain
        label: Complain to the platform
        hours: 2
        effects:
          - { type: energy, delta: -2 }
      - id: accept
        label: Let it go
        hours: 0
        effects:
          - { type: energy, delta: -4 }

  - id: november_empty
    area: sales
    weight: 3
    once: false
    cooldownWeeks: 40
    when: [tour.month == 11, tour.bookedWeek < 20]
    from: none
    sender: Your calendar
    look: note
    text: >-
      November: two of twelve rooms booked all week. You could close a floor and save heating,
      or call the firms in the valley about project staff. The lake is beautiful and nobody is
      looking at it.
    defaultChoice: wait
    choices:
      - id: call_firms
        label: Call the firms in the valley
        hours: 6
        effects:
          - { type: guests, segment: project_guests, count: 12 }
      - id: close_floor
        label: Close the top floor until spring
        hours: 1
        effects:
          - { type: cash, amountCents: 60000 }
      - id: wait
        label: Wait for December
        hours: 0

  - id: wedding_fair
    area: sales
    weight: 1
    once: true
    when: [tour.month >= 1, tour.month <= 3]
    from: none
    sender: A wedding fair in Munich
    look: official
    text: >-
      A wedding fair in Munich offers a stand for a weekend. Two days of brides, mothers of brides
      and planners comparing table linen. Without an event room it is two days of explaining that
      you will have one.
    defaultChoice: skip
    choices:
      - id: stand
        label: Take a stand
        hours: 14
        effects:
          - { type: cash, amountCents: -60000 }
          # Plan 2 audit: as the text says, without an event room nobody books.
          - { type: guests, segment: groups, count: 48, when: [shipped.event_room >= 1] }
          - { type: energy, delta: -5 }
      - id: skip
        label: Skip it
        hours: 0

  - id: christmas_vouchers_hotel
    area: sales
    weight: 2
    once: true
    when: [tour.month == 12]
    from: none
    sender: Your accountant
    look: note
    text: >-
      Your accountant suggests selling gift vouchers for spring weekends before Christmas. Cash in
      the quietest month, guests in the spring, and a few vouchers nobody ever uses. Selling them
      takes a few evenings online.
    defaultChoice: skip
    choices:
      - id: sell
        label: Sell gift vouchers
        hours: 5
        effects:
          - { type: cash, amountCents: 60000 }
          - { type: guests, segment: leisure, count: 6 }
      - id: skip
        label: Skip it
        hours: 0

  - id: rate_parity_letter
    area: sales
    weight: 1
    once: true
    when: [tour.listed == 1]
    from: none
    sender: Zimmerfrei
    look: official
    text: >-
      The platform writes that your own website must not be cheaper than its listing. A lawyer
      friend says that rule no longer holds in Germany. The platform's ranking may disagree with
      the lawyer.
    defaultChoice: comply
    choices:
      - id: ignore
        label: Keep your website cheaper
        hours: 1
        effects:
          - { type: guests, segment: leisure, count: 8 }
          - { type: review, rating: 3, count: 1 }
      - id: comply
        label: Keep the rates equal
        hours: 0

  - id: regatta_weekend
    area: sales
    weight: 2
    once: true
    when: [tour.month == 8]
    from: none
    sender: The sailing club
    text: >-
      The sailing club asks for rooms for its regatta crews: twenty sailors, two nights, early
      breakfasts and a lot of wet kit. They pay well and leave sand everywhere.
    defaultChoice: decline
    choices:
      - id: host
        label: Host the crews
        hours: 3
        effects:
          - { type: guests, segment: groups, count: 24 }
          - { type: review, rating: 3, count: 2, when: [tour.bookedWeek >= 70] }
      - id: decline
        label: Decline
        hours: 0

  # Plan 2 audit, T6 round 2: offers whose effort pays only in the situation their text names.
  - id: travel_fair_stand
    area: sales
    weight: 2
    once: true
    when: [week >= 10, tour.month >= 1, tour.month <= 3]
    from: none
    sender: The travel fair in Munich
    look: official
    text: >-
      The travel fair in Munich has a stand left in the lakes hall: 900 EUR and two long days.
      The buyers walk straight past any house rated under 4.3, and they have had a lot of
      practice.
    defaultChoice: skip
    choices:
      - id: stand
        label: Take the stand
        hours: 12
        effects:
          - { type: cash, amountCents: -90000 }
          - { type: guests, segment: leisure, count: 30, when: [tour.rating >= 43] }
      - id: skip
        label: Skip the fair
        hours: 0

  - id: influencer_couple
    area: sales
    weight: 2
    once: true
    when: [week >= 8]
    from: none
    sender: Two people with a travel account
    text: >-
      A couple with a travel account asks for two free nights in exchange for photos of the lake.
      Their followers check the reviews before they book anything. With fewer than twenty, the
      photos are just a nice weekend for two people you have never met.
    defaultChoice: decline
    choices:
      - id: host
        label: Host them for free
        hours: 3
        effects:
          - { type: cash, amountCents: -30000 }
          - { type: guests, segment: leisure, count: 12, when: [tour.reviews >= 20] }
      - id: decline
        label: Decline politely
        hours: 0

  - id: winter_rates_mailing
    area: sales
    weight: 2
    once: true
    when: [week >= 20]
    from: none
    sender: Your booking software
    text: >-
      Your booking software suggests a mailing to past guests with a quiet-season rate, a fifth
      off. When the house is empty it fills rooms that would earn nothing. In the summer it only
      sells cheaply what would have sold anyway.
    defaultChoice: decline
    choices:
      - id: send
        label: Write and send the mailing
        hours: 4
        effects:
          - { type: guests, segment: leisure, count: 10, when: [tour.peak == 0] }
          - { type: cash, amountCents: -60000, when: [tour.peak == 1] }
      - id: decline
        label: Not now
        hours: 0

  - id: conference_directory
    area: sales
    weight: 1
    once: true
    when: [week >= 15]
    from: none
    sender: A conference directory
    look: official
    text: >-
      A conference directory offers a listing for 400 EUR. Firms that book project teams through
      it filter for a room to work in first and the view second. A house without a workspace
      does not appear in their search at all.
    defaultChoice: decline
    choices:
      - id: list
        label: Buy the listing
        hours: 3
        effects:
          - { type: cash, amountCents: -40000 }
          - { type: guests, segment: project_guests, count: 15, when: [shipped.workspace >= 1] }
      - id: decline
        label: Decline
        hours: 0

  - id: sauna_salesman
    area: sales
    weight: 1
    once: true
    when: [week >= 6]
    from: none
    sender: A sauna salesman
    text: >-
      A sauna salesman offers to bring his best customers on a weekend tour of houses with his
      cabins. It takes a Saturday of showing people round. They only stay where there is a sauna
      to admire, and he checks.
    defaultChoice: decline
    choices:
      - id: tour
        label: Join his weekend tour
        hours: 6
        effects:
          - { type: cash, amountCents: -15000 }
          - { type: guests, segment: leisure, count: 10, when: [shipped.wellness >= 1] }
      - id: decline
        label: Decline
        hours: 0
