      - week >= 12
      - leisure.open == 1
    from: none
    sender: Your studio notebook
    look: note
    text:
      Staff bring attendance figures, member requests and three incompatible holiday plans. The room
      contains enough evidence for a useful decision. It also contains enough opinions for a long
      evening. Use the Calendar or membership controls for any lasting change; this follow-up
      handles the conversation.
    defaultChoice: act
    choices:
      - id: act
        label: Make room for a break
        hours: 0
        effects:
          - type: energy
            delta: 6
      - id: leave
        label: Inspect more snags instead
        hours: 4
        effects:
          - type: bugs
            delta: -1
            when:
              - bugs >= 1
