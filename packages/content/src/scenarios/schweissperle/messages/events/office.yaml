events:
  - id: neighbouring_keys
    area: finance
    weight: 2
    once: false
    cooldownWeeks: 12
    when:
      - week >= 26
      - office.stage == 1
      - months.coveringAll >= 2
    trigger:
      - tour.turnedAwayWeeks >= 3
    from: none
    sender: Your landlord
    look: official
    text:
      The adjoining shop can become another mat-class room for 30,000 EUR, with six weeks of work
      and another 3,800 EUR a month. Strength, yoga and lunch classes share its timetable. It is in
      the same building; extra spin bikes are not included.
    defaultChoice: stay
    choices:
      - id: move
        label: Add the adjoining mat room
        hours: 4
        effects:
          - type: officeMove
            stage: wider_class_shop
      - id: stay
        label: Keep the two-room studio
        hours: 0
        effects: []
