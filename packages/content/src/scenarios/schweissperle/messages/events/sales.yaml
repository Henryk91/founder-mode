      - leisure.open == 1
    from: none
    sender: Your studio notebook
    look: note
    text:
      Weekend yoga fills without the spin room making a sound. The teacher asks for a regular place
      in the timetable. Sunday cleaning is not in the weekday quote. Use the Calendar or membership
