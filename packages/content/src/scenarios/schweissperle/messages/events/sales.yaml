    defaultChoice: leave
    choices:
      - id: act
        label: Check usable times and invite a trial
        hours: 3
        effects:
          - type: guests
            segment: yoga_crowd
            count: 3
            when:
              - leisure.open == 1
              - shipped.yoga_classes == 1
      - id: leave
        label: Leave the current offer unchanged
        hours: 0
        effects: []
