events:
  - id: six_thirty
    area: sales
    weight: 1
    once: false
    cooldownWeeks: 12
    when:
      - week >= 12
      - leisure.open == 1
    from: none
    sender: Your studio notebook
    look: note
    text:
      The early class fills while the afternoon class has two bookings. One afternoon booking is an
      instructor checking the app. The early members ask for another morning. Use the Calendar or
      membership controls for any lasting change; this follow-up handles the conversation.
    defaultChoice: leave
    choices:
      - id: act
        label: Check usable times and invite a trial
        hours: 3
        effects:
          - type: guests
            segment: young_professionals
            count: 3
            when:
              - leisure.open == 1
      - id: leave
        label: Leave the current offer unchanged
        hours: 0
        effects: []
  - id: march_attendance
    area: sales
    weight: 1
    once: false
    cooldownWeeks: 12
    when:
      - week >= 12
      - leisure.open == 1
      - tour.month == 3
    from: none
    sender: Your studio notebook
    look: note
    text: Several January members have stopped coming and started sending cancellation emails. Their
      evening reservations are still in the app. The instructor is still on the payroll. Use the
      Calendar or membership controls for any lasting change; this follow-up handles the
      conversation.
    defaultChoice: leave
    choices:
      - id: act
        label: Check usable times and invite a trial
        hours: 3
        effects:
          - type: guests
            segment: young_professionals
            count: 3
            when:
              - leisure.open == 1
      - id: leave
        label: Leave the current offer unchanged
        hours: 0
        effects: []
  - id: cheap_afternoons
    area: sales
    weight: 1
    once: false
    cooldownWeeks: 12
    when:
      - week >= 12
      - leisure.open == 1
    from: none
    sender: Your studio notebook
    look: note
    text:
      A member asks whether the off-peak offer includes the evening class she can actually attend.
      It does not. The price is clear; her calendar is clearer. Use the Calendar or membership
      controls for any lasting change; this follow-up handles the conversation.
    defaultChoice: leave
    choices:
      - id: act
        label: Explain the usable slots
        hours: 3
        effects:
          - type: review
            rating: 4.5
            count: 1
            when:
              - leisure.members >= 10
      - id: leave
        label: Call it equivalent unlimited access
        hours: 0
        effects:
          - type: review
            rating: 2
            count: 2
            when:
              - leisure.members >= 10
  - id: the_sunday_class
    area: sales
    weight: 1
    once: false
