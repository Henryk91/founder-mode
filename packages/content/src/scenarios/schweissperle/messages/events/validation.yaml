events:
  - id: the_january_queue
    area: validation
    weight: 1
    once: false
    cooldownWeeks: 12
    when:
      - week >= 12
      - leisure.open == 1
      - tour.month == 1
    from: none
    sender: Your studio notebook
    look: note
    text: The waitlist contains familiar names and people who joined yesterday. The new people have
      booked the next six evenings. Your spring timetable is still written in pencil. Use the
      Calendar or membership controls for any lasting change; this follow-up handles the
      conversation.
    defaultChoice: leave
    choices:
      - id: act
        label: Check usable times and invite a trial
        hours: 3
        effects:
          - type: guests
            segment: young_professionals
            count: 3
            when:
              - leisure.open == 1
      - id: leave
        label: Leave the current offer unchanged
        hours: 0
        effects: []
  - id: the_lunch_experiment
    area: validation
    weight: 1
    once: false
    cooldownWeeks: 12
