      - week >= 12
      - leisure.open == 1
    from: none
    sender: Your studio notebook
    look: note
    text: A nearby firm's employees can leave for forty-five minutes. Your lunch class lasts forty
      minutes before changing and walking back. The HR organiser has brought a watch. Use the
      Calendar or membership controls for any lasting change; this follow-up handles the
      conversation.
    defaultChoice: leave
    choices:
      - id: act
        label: Check usable times and invite a trial
        hours: 3
        effects:
          - type: guests
            segment: corporate
            count: 3
            when:
              - leisure.open == 1
              - shipped.lunch_classes == 1
      - id: leave
        label: Leave the current offer unchanged
        hours: 0
        effects: []
