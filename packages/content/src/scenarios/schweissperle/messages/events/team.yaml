  - id: her_own_place
    area: team
    weight: 2
    once: false
    cooldownWeeks: 26
    when:
      - week >= 20
      - leisure.open == 1
      - leisure.members >= 25
    from: none
    sender: Your most followed instructor
    look: letter
    text:
      Your most followed instructor has been offered a room elsewhere. Matching the offer adds 150
      EUR a month to the studio payroll. Letting the instructor leave stops real followers
      attending, while agreed terms and owed class packs remain on the books.
    defaultChoice: leave
    choices:
      - id: match
        label: Match the continuing offer
        hours: 2
        effects:
          - type: fixedCost
            id: retention
            name: Instructor retention supplement
            monthlyCents: 15000
      - id: leave
        label: Let the instructor leave with a handover
        hours: 0
        effects:
          - type: leisureInstructor
            role: most_followed
