events:
  - id: the_farewell_class
    area: team
    weight: 1
    once: false
    cooldownWeeks: 12
    when:
      - week >= 12
      - leisure.open == 1
    from: none
    sender: Your class team
    look: note
    text:
      Members thank the departing instructor and ask where she will teach next. Your timetable still
      shows her name. The app needs an answer before it needs a new photograph. Use the Calendar or
      membership controls for any lasting change; this follow-up handles the conversation.
    defaultChoice: leave
    choices:
      - id: act
        label: Call members and review the cover
        hours: 3
        effects:
          - type: review
            rating: 4.5
            count: 1
            when:
              - leisure.members >= 20
      - id: leave
        label: Keep the current class arrangements
        hours: 0
        effects:
          - type: review
            rating: 2
            count: 1
            when:
              - leisure.packed >= 1
  - id: thirteen_classes
    area: team
    weight: 1
    once: false
    cooldownWeeks: 12
    when:
      - week >= 12
      - leisure.open == 1
    from: none
    sender: Your class team
    look: note
    text:
      The rota could put thirteen classes on one retained instructor. The workload display counts
      the founder across roles and each named instructor separately. Check actual loads before
      adding another class; use the Calendar to change them.
    defaultChoice: leave
    choices:
      - id: act
        label: Discuss the actual teaching loads
        hours: 3
        effects:
          - type: energy
            delta: 2
      - id: leave
        label: Keep the planned class count
        hours: 0
        effects: []
  - id: seventeen_thirty
    area: team
    weight: 1
    once: false
    cooldownWeeks: 12
    when:
      - week >= 12
      - leisure.open == 1
    from: none
    sender: Your class team
    look: note
    text: The six o'clock teacher calls in sick. Cover is available at a premium. The members are
      already putting shoes in bags. Use the Calendar or membership controls for any lasting change;
      this follow-up handles the conversation.
    defaultChoice: leave
    choices:
      - id: act
        label: Pay the incident cover
        hours: 1
        effects:
          - type: cash
            amountCents: -8000
          - type: review
            rating: 4.5
            count: 1
      - id: leave
        label: Notify the affected class
        hours: 0
        effects:
          - type: review
            rating: 2
            count: 2
