# Kantino: shared lunch ordering for workplaces. Source: docs/scenario-kantino.md
# All values are untested starting points. Money in cents, time in hours.

id: kantino
name: Kantino
maxWeeks: 60

start:
  cashCents: 900000
  savingsCents: 1425000
  livingCostCentsPerWeek: 67500
  priceCentsPerMonth: 45000
  energy: 80
  skills:
    interviewing: 0.1
    selling: 0.1
  fixedCosts:
    - id: tools_hosting
      name: Tools and hosting
      monthlyCents: 18000
    - id: accountant
      name: Accountant
      monthlyCents: 22500

founder:
  baseHoursPerWeek: 50
  maxHoursPerWeek: 65
  energy:
    max: 100
    perHourOverBase: -1
    perRestHour: 1.5
    weeklyRecovery: 3
    fullAt: 70
    lowBelow: 30
    lowFactor: 0.85
    burnoutWeeks: 3

finance:
  weeksPerMonth: 4
  # Customers are invoiced at every month end. An invoice is due after 14 days and then paid
  # late by a segment dependent number of days, only once chased, or never.
  invoiceDueDays: 14
  writeOffWeeks: 8
  chaseHours: 1
  chaseBoost: 0.3

experiments:
  interview:
    hours: 2
    noiseSd: 0.3
    skillGain: 0.01
    skillCap: 0.8
    mentionBase: 0.3
    mentionPerPain: 0.3
    # About one interview in six names a budget, within about a quarter either side (Zollstock:
    # one in four; fewer here, so reading them is worth a little less, Phase 8 step 4).
    budgetChance: 0.17
    budgetNoiseSd: 0.25
    buckets:
      - { id: not_a_problem, name: Not a problem, below: 0.2 }
      - { id: mild, name: Mild, below: 0.4 }
      - { id: noticeable, name: Noticeable, below: 0.6 }
      - { id: painful, name: Painful, below: 0.9 }
      - { id: urgent, name: Urgent }
  landing:
    hours: 8
    budgetsCents: [30000, 75000]
    centsPerVisitor: 225
    weeks: 1
    signupBase: 0.02
    signupPerPain: 0.15
    signupsPerLead: 5
  presale:
    hoursPerBatch: 6
    batchSize: 5
    weeks: 1
    commitRate: 0.25
    maxBatchesPerSegment: 3
    refundWeeks: 8

product:
  startQuality: 70
  qualityPerBug: 3
  fixHoursPerBug: 4
  fitBase: 0.5
  fitPerQuality: 0.5

sales:
  sellingBase: 0.5
  saturationHours: 12
  saturationWeeks: 3
  saturatedFactor: 0.3
  leadToDemoBase: 0.18
  leadToDemoOffset: 0.4
  leadToDemoPerPain: 0.6
  demoHours: 3
  followUpHours: 1
  followUpDemoBoost: 0.05
  demoToTrialBase: 0.05
  demoToTrialPerFit: 0.35
  trialWeeks: 1
  ghostChancePerWeek: 0.1
  silentWeeksToLose: 4
  skillGainPerDemo: 0.005
  skillCap: 0.8
  # Price against willingness to pay (r = price / wtp): a yes stays nearly as likely up to about
  # r 0.9, then gets rarer smoothly (0.97 at r 1, 0.82 at 1.2, a half at the midpoint, 0.24 at
  # 1.5). Calibrated so the default price plays as before (Phase 8 gate).
  price: { midpoint: 1.35, steepness: 10 }
  churn:
    base: 0.03
    perMisfit: 0.2
    perBug: 0.01
    # Customers paying more than what they would pay leave more often: +0.15 a month per 100%
    # above it, on top of the rest.
    priceFrom: 1.0
    perPrice: 0.15
    cap: 0.6
  # Referrals are off in Kantino: office managers do not recommend lunch tools to each other.
  referral:
    chancePerFit: 0
    chancePerBug: 0
    demoBonus: 0

team:
  searchHours: 6
  searchWeeks: 2
  candidates: 3
  startWeeks: 2
  severanceWeeks: 4
  impressionSd: 0.25
  impressions:
    - { id: weak, name: Weak, below: 0.7 }
    - { id: solid, name: Solid, below: 0.95 }
    - { id: strong, name: Strong, below: 1.1 }
    - { id: outstanding, name: Outstanding }
  roles:
    # A junior or part time hire: cheaper, fewer hours.
    developer:
      name: Developer
      monthlyCents: 390000
      weeklyHours: 20
      skill: { min: 0.5, max: 1.2 }
    salesperson:
      name: Salesperson
      monthlyCents: 330000
      weeklyHours: 20
      skill: { min: 0.5, max: 1.2 }
      selling: 0.3
  candidateNames:
    - Anselm Brandt
    - Berit Kowalczyk
    - Cosima Wendt
    - Dario Feldmann
    - Elke Hartmann
    - Florian Scholz
    - Greta Lindqvist
    - Henrik Aumann
    - Ilse Brunner
    - Jonas Ruprecht
    - Katja Merkel
    - Lukas Oberhuber
    - Mathilde Sauer
    - Nils Eckhardt
    - Odile Fraunhofer
    - Paulina Vogt
    - Rainer Zeller
    - Sabine Kellner
    - Tobias Nagel
    - Ursula Pfeiffer
    - Viktor Hahn
    - Wiebke Stadler

  # Phase 9: a freelancer, rented by the week. Output is visible and fixed: outputShare of the
  # booked hours become work, the first week at onboardingFactor of that. Billed weekly per hour.
  freelance:
    hoursOptions: [10, 20]
    outputShare: 0.9
    onboardingFactor: 0.5
    noticeWeeks: 1
    # A developer who does not know the code: extra bugs on every feature they worked on.
    extraBugsPerFeature: 1
    roles:
      developer:
        name: Freelance developer
        centsPerHour: 6800
      salesperson:
        name: Freelance salesperson
        centsPerHour: 5800
        selling: 0.2
    names:
      - Arne Lindgren
      - Bettina Roos
      - Cem Yildiz
      - Dagmar Wolke
      - Emil Sandau
      - Frieda Kessler
      - Gero Matthes
      - Hanna Brecht

# The inbox: each week up to maxPerWeek events are drawn by weight from the eligible ones.
inbox:
  maxPerWeek: 3
  drawChance: 0.4
  openWeeks: 2
  guaranteeBelowOpen: 2
  cooldownWeeks: 8
  openLimit: 4

# Shuffled across the segments at game creation, one role each.
roles:
  - id: viable
    pain: { min: 0.6, max: 0.85 }
    politeness: { min: 0.05, max: 0.15 }
  - id: mediocre
    pain: { min: 0.35, max: 0.55 }
    politeness: { min: 0.25, max: 0.4 }
  - id: trap
    pain: { min: 0.1, max: 0.25 }
    politeness: { min: 0.5, max: 0.65 }

segments:
  - id: small_offices
    name: Small offices
    description: Agencies and firms with 10 to 50 staff
    size: { min: 800, max: 2000 }
    wtpCents: { min: 37500, max: 72000 }
    mustHave: [basic_ordering, invoice_export, chat_integration]
    channelResponse:
      cold_email: { min: 0.05, max: 0.1 }
      phone: { min: 0.04, max: 0.075 }
      in_person: { min: 0.025, max: 0.125 }
    paymentDelayDaysMean: 5
    neverPaysShare: 0.0125
    waitsForChaseShare: 0.25
    # Budget quotes: some interviews name a rough monthly figure, honest on average.
    budgetQuotes:
      - 'Between takeaways and the time it eats, lunch costs us about {amount} a month. Nobody budgets for it.'
      - 'Our office manager reckons the lunch chaos costs about {amount} a month of her time alone.'
      - 'We would pay something like {amount} a month if the lunch spreadsheet went away for good.'
      - 'I signed off roughly {amount} a month for team lunches last year. Most of it went on delivery fees.'
      - 'A caterer quoted us about {amount} a month. We laughed, then we did the maths.'

  - id: coworking
    name: Coworking spaces
    description: Shared workspaces with many small tenants
    size: { min: 100, max: 300 }
    wtpCents: { min: 70000, max: 100000 }
    mustHave: [basic_ordering, multi_site, member_billing]
    channelResponse:
      cold_email: { min: 0.025, max: 0.06 }
      phone: { min: 0.0425, max: 0.0935 }
      in_person: { min: 0.051, max: 0.102 }
    paymentDelayDaysMean: 12
    neverPaysShare: 0.0075
    waitsForChaseShare: 0.25
    # Budget quotes: some interviews name a rough monthly figure, honest on average.
    budgetQuotes:
      - 'We pay the caterer about {amount} a month and still get complaints on the community board.'
      - 'If it kept tenants from leaving, about {amount} a month would be a bargain.'
      - 'Billing lunch across our sites costs about {amount} a month in admin. The admin is me.'
      - 'Our last lunch partner charged about {amount} a month. They went bust, which tells you something.'
      - "The members' café loses about {amount} a month. Lunch is where it bleeds."

  - id: medical
    name: Medical practices
    description: Doctors and dentists with shift based teams
    size: { min: 400, max: 1200 }
    wtpCents: { min: 45000, max: 70000 }
    mustHave: [basic_ordering, allergy_filter, shift_schedule]
    channelResponse:
      cold_email: { min: 0.04, max: 0.08 }
      phone: { min: 0.066, max: 0.1375 }
      in_person: { min: 0.066, max: 0.132 }
    paymentDelayDaysMean: 20
    neverPaysShare: 0.02
    waitsForChaseShare: 0.25
    # Budget quotes: some interviews name a rough monthly figure, honest on average.
    budgetQuotes:
      - "Staff lunches run to about {amount} a month, mostly cold sandwiches at four o'clock."
      - 'Our practice manager spends about {amount} a month of her time on lunch orders. Officially she does rotas.'
      - 'We set aside roughly {amount} a month for staff meals. It never quite stretches.'
      - 'The pharmacy rep used to bring lunch. Replacing that costs us about {amount} a month.'
      - 'I would sign off about {amount} a month if reception stopped being a canteen.'

# Milestones (plan section 4.12). Revenue milestones cover the run's own monthly costs at the time:
# company costs, or company costs plus living costs. onBar: false keeps one off the progress bar.
milestones:
  - { id: first_interview, name: First interview, kind: count, of: interviews, target: 1 }
  - { id: first_deposit, name: First deposit, kind: count, of: deposits, target: 1 }
  - { id: first_customer, name: First paying customer, kind: count, of: customers, target: 1 }
  - id: covers_company_costs
    name: 'Monthly revenue covers company costs'
    kind: revenue
    covers: company
  - id: covers_all_costs
    name: 'Monthly revenue covers all costs, you included'
    kind: revenue
    covers: all
  - { id: first_hire, name: First hire, kind: count, of: hires, target: 1, onBar: false }
  - { id: weeks_26, name: 26 weeks survived, kind: weeks, target: 26 }
  - { id: weeks_52, name: 52 weeks survived, kind: weeks, target: 52 }

# Office stages (spec section 9). The first is the start; the coworking desk comes through the
# inbox event `coworking_desk`. Accepting replaces the stage's cost and effects.
officeStages:
  - { id: kitchen_table, name: Kitchen table, monthlyCents: 0 }
  # Phase 7: walk-in leads from the coworking market instead of outreach factors and energy. Tuned
  # so the desk clearly helps when coworking is the real market and hurts when it is not.
  - id: coworking_desk
    name: Coworking desk
    monthlyCents: 37500
    walkIns: { segment: coworking, leadsPerWeek: 0.9 }

# The UI turns organised at the first of these milestones (plan section 4.12): the first hire, or
# revenue covering all costs. Company costs alone came with the first customer; see decisions.
organisedAt: [first_hire, covers_all_costs]

# Long mode (Phase 9 part C): 104 weeks, laid over everything above. Objects merge, lists replace.
# The 60 week game never sees this block, so its values and fingerprint stay as they are.
modes:
  long:
    maxWeeks: 104
    # Plan 3: the established look once money in has covered all costs for these months in a row,
    # on moving into office stage 4, or once a funding round has closed (target E1).
    establishedAt: { monthsCoveringAll: 8, officeStage: 4, funded: true }
    # A long game should prove it lasts: profitable in each of the last three months.
    win: { profitableMonths: 3 }
    founder:
      # Year 2 costs more: living costs rise by a tenth from week 53.
      livingSteps:
        - { week: 53, centsPerWeek: 74250 }
    sales:
      # Markets run out of new leads: response falls with the share of companies already found.
      marketSaturation: { floor: 0.3 }
      # A channel wears out after 24 h a week over three weeks (12 in the 60 week game), so a
      # salesperson beside the founder is not selling only in worn out channels (C3, plan 3.1).
      saturationHours: 24
    team:
      maxMembers: 4
      maxHires: 8
      managementHoursPerMember: 2
      # Full time and realistic for Munich (docs/phase9-proposal.md 8.1): gross salary plus about
      # 21% employer's social security, over 13 game months of 4 weeks a year. Developer 75,000
      # EUR gross, salesperson 65,000 EUR fixed. Part time is half of each, so the two agree
      # per hour (the 60 week part time hire keeps its own tuned salary).
      roles:
        developer:
          name: Developer
          monthlyCents: 700000
          weeklyHours: 40
          partTime: { monthlyCents: 350000, weeklyHours: 20 }
        salesperson:
          name: Salesperson
          monthlyCents: 605000
          weeklyHours: 40
          # A professional seller: better than a founder at the skill cap (0.8), C3 plan 3.1.
          selling: 1.0
          partTime: { monthlyCents: 302500, weeklyHours: 20 }
    # Plan 3 (docs/office-stages.md): office stages 3 to 5, offered by the inbox (office.yaml).
    # Every person needs a desk, the founder included. Munich office rents of about 20 to 25 EUR a
    # square metre a month plus service costs (est.); deposits of three months' rent.
    office: { noticeWeeks: 13, moveHoursPerWeek: 4 }
    # Three desks at the kitchen table and four at the coworking desk, where a desk more is only
    # rent (spec: two each), so a funded team can grow before it moves (plan 3 steps 2 and 4,
    # decisions).
    officeStages:
      - { id: kitchen_table, name: Kitchen table, monthlyCents: 0, desks: 3 }
      - id: coworking_desk
        name: Coworking desk
        monthlyCents: 37500
        desks: 4
        walkIns: { segment: coworking, leadsPerWeek: 0.9 }
      - id: courtyard_office
        name: Small office in a back courtyard
        # About 60 m² (est.); 4,500 EUR deposit and 1,500 EUR of furniture.
        monthlyCents: 150000
        oneOffCents: 600000
        depositCents: 450000
        moveWeeks: 2
        desks: 4
        energyPerWeek: 1
        demoFactor: 1.05
      - id: office_floor
        name: Office floor
        # About 150 m² (est.); 11,400 EUR deposit and 3,600 EUR of furniture.
        monthlyCents: 380000
        oneOffCents: 1500000
        depositCents: 1140000
        moveWeeks: 3
        desks: 6
        energyPerWeek: 2
        demoFactor: 1.1
        searchWeeksLess: 1
      - id: front_desk
        name: Front desk and a proper meeting room
        # About 300 m² (est.); 22,500 EUR deposit and 2,500 EUR of furniture.
        monthlyCents: 750000
        oneOffCents: 2500000
        depositCents: 2250000
        moveWeeks: 4
        desks: 10
        maxMembers: 8
        energyPerWeek: 2
        demoFactor: 1.1
        searchWeeksLess: 1
        # Coworking operators pay the most and judge a supplier by the office they visit.
        segmentFactors: { coworking: 1.1 }
    experiments:
      # Money cannot buy leads without limit: three landing tests per market (Part D).
      landing: { maxTestsPerSegment: 3 }
    # Raising money (Part D, docs/phase9-proposal.md section 11). Amounts are realistic for a
    # Munich start-up (8.1 and 11.4); the pre-money floors are estimates.
    funding:
      # The company starts paying its founder only after outside money arrives: a modest 2,500 EUR
      # monthly salary (plan 2 step 5), on top of the living costs that came from savings.
      founderSalaryCents: 250000
      rounds:
        angel:
          name: Angel round
          prepHours: 8
          pitchHoursPerMeeting: 5
          secondLookHours: 5
          termSheetWeeks: 2
          closingWeeks: 3
          dueDiligenceHours: 0
          barMonthlyCents: 300000
          barText: We back companies with paying customers and revenue that grows.
          # A smaller angel cheque gives traction enough runway without making bootstrapping moot.
          amountCents: { min: 8000000, max: 18000000 }
          preMoneyFloorCents: 150000000
          revenueMultiple: 20
          # An angel who invests before the revenue bar offers a smaller cheque at a lower
          # valuation: visibly more equity for less money, instead of a hidden luck penalty.
          weakTractionTerms: { amountFactor: 0.25, preMoneyFactor: 0.4 }
          investors:
            - Margit Ostler
            - Benedikt Rauch
            - Yasemin Kurt
            - Eckart Leuthold
            - Hanne Wiesinger
            - Ruben Albers
            - Sieglinde Maurer
            - Tarek Haddad
            - Ottilie Brem
            - Carsten Vogl
        seed:
          name: Seed round
          prepHours: 12
          pitchHoursPerMeeting: 5
          secondLookHours: 8
          termSheetWeeks: 2
          closingWeeks: 4
          dueDiligenceHours: 16
          barMonthlyCents: 1000000
          barText: We look for monthly revenue around 10,000 EUR, growing every month.
          amountCents: { min: 100000000, max: 250000000 }
          preMoneyFloorCents: 500000000
          revenueMultiple: 25
          milestone: { multiple: 2, weeks: 26 }
          withdrawDrop: 0.1
          investors:
            - Isarwerk Ventures
            - Gruenspan Capital
            - Alpenkamm Partners
            - Leopold Seed Fund
            - Brennerhof Capital
            - Nordbahn Ventures
      appetite: { min: 1.4, max: 2.0 }
      noiseSd: 0.25
      scoreExponent: 1
      pitchBase: 0.85
      pitchPerSelling: 0.3
      growthWeight: 2
      growthFactor: { min: 0.5, max: 1.5 }
      flatGrowth: 0.05
      runwayMarginWeeks: 4
      churnShare: 0.33
      focusShare: 0.6
      updates:
        properHours: 2
        shortHours: 1
        proper: 0.08
        short: 0.02
        none: -0.06
        revenueUp: 0.04
        revenueDown: -0.04
        milestoneMissed: -0.2
      startConfidence: 0.6
      followOnAppetite: { pleased: 0.8, worried: 1.25 }
      moodAt: { patient: 0.4, pleased: 0.7 }
      valueRevenueMultiple: 8
      growing: { runwayMonths: 12, quarterGrowth: 0.1 }
    milestones:
      - { id: first_interview, name: First interview, kind: count, of: interviews, target: 1 }
      - { id: first_deposit, name: First deposit, kind: count, of: deposits, target: 1 }
      - { id: first_customer, name: First paying customer, kind: count, of: customers, target: 1 }
      - id: covers_company_costs
        name: 'Monthly revenue covers company costs'
        kind: revenue
        covers: company
      - id: covers_all_costs
        name: 'Monthly revenue covers all costs, you included'
        kind: revenue
        covers: all
      - { id: first_hire, name: First hire, kind: count, of: hires, target: 1, onBar: false }
      - { id: weeks_26, name: 26 weeks survived, kind: weeks, target: 26 }
      - { id: weeks_52, name: 52 weeks survived, kind: weeks, target: 52 }
      - { id: weeks_78, name: 78 weeks survived, kind: weeks, target: 78 }
      - { id: weeks_104, name: 104 weeks survived, kind: weeks, target: 104 }
