# Kantino: shared lunch ordering for workplaces. Source: docs/scenario-kantino.md
# All values are untested starting points. Money in cents, time in hours.

id: kantino
name: Kantino
maxWeeks: 78

start:
  cashCents: 1000000
  savingsCents: 1200000
  livingCostCentsPerWeek: 45000
  priceCentsPerMonth: 30000
  energy: 80
  skills:
    interviewing: 0.1
    selling: 0.1
  fixedCosts:
    - id: tools_hosting
      name: Tools and hosting
      monthlyCents: 12000
    - id: accountant
      name: Accountant
      monthlyCents: 15000

founder:
  baseHoursPerWeek: 50
  maxHoursPerWeek: 65
  energy:
    max: 100
    perHourOverBase: -2
    perRestHour: 1.5
    weekWithinBase: 3
    fullAt: 70
    lowBelow: 30
    lowFactor: 0.85
    burnoutWeeks: 3

finance:
  weeksPerMonth: 4
  # Customers are invoiced at every month end. An invoice is due after 14 days and then paid
  # late by a segment dependent number of days, only once chased, or never.
  invoiceDueDays: 14
  writeOffWeeks: 8
  chaseHours: 1
  chaseBoost: 0.3

experiments:
  interview:
    hours: 2
    noiseSd: 0.3
    skillGain: 0.01
    skillCap: 0.8
    mentionBase: 0.3
    mentionPerPain: 0.3
    buckets:
      - { id: not_a_problem, name: Not a problem, below: 0.2 }
      - { id: mild, name: Mild, below: 0.4 }
      - { id: noticeable, name: Noticeable, below: 0.6 }
      - { id: painful, name: Painful, below: 0.9 }
      - { id: urgent, name: Urgent }
  landing:
    hours: 8
    budgetsCents: [20000, 50000]
    centsPerVisitor: 150
    weeks: 1
    signupBase: 0.02
    signupPerPain: 0.15
    signupsPerLead: 5
  presale:
    hoursPerBatch: 6
    batchSize: 5
    weeks: 1
    commitRate: 0.25
    maxBatchesPerSegment: 3
    refundWeeks: 8

product:
  startQuality: 70
  qualityPerBug: 3
  fixHoursPerBug: 4
  fitBase: 0.5
  fitPerQuality: 0.5

sales:
  sellingBase: 0.5
  leadToDemoBase: 0.18
  leadToDemoOffset: 0.4
  leadToDemoPerPain: 0.6
  demoHours: 3
  followUpHours: 1
  followUpDemoBoost: 0.05
  demoToTrialBase: 0.05
  demoToTrialPerFit: 0.4
  trialWeeks: 1
  ghostChancePerWeek: 0.1
  silentWeeksToLose: 4
  skillGainPerDemo: 0.005
  skillCap: 0.8
  priceSlope: 2
  churn:
    base: 0.03
    perMisfit: 0.2
    perBug: 0.01
    cap: 0.6

team:
  searchHours: 6
  searchWeeks: 2
  candidates: 3
  startWeeks: 2
  severanceWeeks: 4
  impressionSd: 0.25
  impressions:
    - { id: weak, name: Weak, below: 0.7 }
    - { id: solid, name: Solid, below: 0.95 }
    - { id: strong, name: Strong, below: 1.1 }
    - { id: outstanding, name: Outstanding }
  roles:
    # A junior or part time hire: cheaper, fewer hours.
    developer:
      name: Developer
      monthlyCents: 260000
      weeklyHours: 25
      skill: { min: 0.5, max: 1.2 }
    salesperson:
      name: Salesperson
      monthlyCents: 220000
      weeklyHours: 20
      skill: { min: 0.5, max: 1.2 }
      selling: 0.3
  candidateNames:
    - Anselm Brandt
    - Berit Kowalczyk
    - Cosima Wendt
    - Dario Feldmann
    - Elke Hartmann
    - Florian Scholz
    - Greta Lindqvist
    - Henrik Aumann
    - Ilse Brunner
    - Jonas Ruprecht
    - Katja Merkel
    - Lukas Oberhuber
    - Mathilde Sauer
    - Nils Eckhardt
    - Odile Fraunhofer
    - Paulina Vogt
    - Rainer Zeller
    - Sabine Kellner
    - Tobias Nagel
    - Ursula Pfeiffer
    - Viktor Hahn
    - Wiebke Stadler

# The inbox: each week up to maxPerWeek events are drawn by weight from the eligible ones.
inbox:
  maxPerWeek: 3
  drawChance: 0.4
  openWeeks: 2
  guaranteeBelowOpen: 2
  cooldownWeeks: 8
  openLimit: 4

# Shuffled across the segments at game creation, one role each.
roles:
  - id: viable
    pain: { min: 0.6, max: 0.85 }
    politeness: { min: 0.05, max: 0.15 }
  - id: mediocre
    pain: { min: 0.35, max: 0.55 }
    politeness: { min: 0.25, max: 0.4 }
  - id: trap
    pain: { min: 0.1, max: 0.25 }
    politeness: { min: 0.5, max: 0.65 }

segments:
  - id: small_offices
    name: Small offices
    description: Agencies and firms with 10 to 50 staff
    size: { min: 800, max: 2000 }
    wtpCents: { min: 20000, max: 45000 }
    mustHave: [basic_ordering, invoice_export, chat_integration]
    channelResponse:
      cold_email: { min: 0.05, max: 0.1 }
      phone: { min: 0.04, max: 0.075 }
      in_person: { min: 0.025, max: 0.125 }
    paymentDelayDaysMean: 5
    neverPaysShare: 0.05
    waitsForChaseShare: 0.25

  - id: coworking
    name: Coworking spaces
    description: Shared workspaces with many small tenants
    size: { min: 100, max: 300 }
    wtpCents: { min: 60000, max: 150000 }
    mustHave: [basic_ordering, multi_site, member_billing]
    channelResponse:
      cold_email: { min: 0.025, max: 0.06 }
      phone: { min: 0.05, max: 0.11 }
      in_person: { min: 0.075, max: 0.15 }
    paymentDelayDaysMean: 12
    neverPaysShare: 0.03
    waitsForChaseShare: 0.25

  - id: medical
    name: Medical practices
    description: Doctors and dentists with shift based teams
    size: { min: 400, max: 1200 }
    wtpCents: { min: 18000, max: 32000 }
    mustHave: [basic_ordering, allergy_filter, shift_schedule]
    channelResponse:
      cold_email: { min: 0.01, max: 0.03 }
      phone: { min: 0.06, max: 0.125 }
      in_person: { min: 0.05, max: 0.1 }
    paymentDelayDaysMean: 20
    neverPaysShare: 0.08
    waitsForChaseShare: 0.25
