# Inbox events. Text is 2 to 4 sentences. {name} is the customer or lead the message is from.
# Conditions: <path> <op> <number>, paths from CONDITION_PATHS in schema.ts. All must hold.
# Effects: closed set in schema.ts. Choices show their hours to the player, never their odds.
# An unanswered message takes its defaultChoice (which costs no hours) when it expires.
events:
  # ---- validation ----
  - id: survey_offer
    area: validation
    weight: 2
    once: true
    when: [week >= 1]
    from: none
    sender: Panel firm
    text: >-
      A market research firm offers to survey 200 office managers for 600 EUR. The sample is
      large. The questions are theirs.
    defaultChoice: pass
    choices:
      - id: buy
        label: Buy the survey
        hours: 1
        effects:
          - { type: cash, amountCents: -60000 }
          - { type: skill, skill: interviewing, delta: 0.03 }
      - id: pass
        label: Pass
        hours: 0

  - id: friend_of_friend
    area: validation
    weight: 2
    when: [week >= 1]
    from: none
    sender: A friend of a friend
    text: >-
      A friend's friend runs an office and offers a free chat about lunch. They are very
      supportive. They would be supportive of anything.
    defaultChoice: decline
    choices:
      - id: call
        label: Take the call
        hours: 2
        effects:
          - { type: lostHours, hours: 2 }
      - id: decline
        label: Politely decline
        hours: 0

  - id: startup_meetup
    area: validation
    weight: 2
    when: [week >= 2]
    from: none
    sender: Meetup organiser
    text: >-
      A founder meetup this week. Free pizza, many pitches, usually one useful conversation.
      It is mostly the pizza.
    defaultChoice: skip
    choices:
      - id: go
        label: Go
        hours: 4
        effects:
          - { type: energy, delta: 4 }
          - { type: newLeads, count: 1, chance: 0.3 }
      - id: skip
        label: Skip it
        hours: 0

  # ---- sales ----
  - id: referral
    area: sales
    weight: 3
    when: [customers.count >= 1]
    from: customer
    sender: Customer
    text: >-
      {name} mentioned Kantino to a neighbour. The neighbour would like to hear from you, and
      has apparently never heard of the word "later".
    defaultChoice: ignore
    choices:
      - id: follow_up
        label: Follow up today
        hours: 1
        effects:
          - { type: newLeads, count: 1 }
      - id: ignore
        label: Let it sit
        hours: 0

  - id: discount_demand
    area: sales
    weight: 2
    when: [customers.count >= 1, week >= 8]
    from: customer
    sender: Customer
    text: >-
      {name} says a competitor charges half as much. They have not named the competitor. They
      would like a discount.
    defaultChoice: hold
    choices:
      - id: free_month
        label: Give them a month free
        hours: 0
        effects:
          - { type: cash, amountCents: -45000 }
      - id: call
        label: Call and explain the value
        hours: 2
        effects:
          - { type: churnChance, delta: 0.05 }
      - id: hold
        label: Hold the price
        hours: 0
        effects:
          - { type: churnChance, delta: 0.05 }

  - id: slow_lead
    area: sales
    weight: 3
    when: [leads.open >= 2]
    from: lead
    sender: Prospect
    text: >-
      {name} says they will decide after the summer. It is currently February.
    defaultChoice: wait
    choices:
      - id: call
        label: Call them
        hours: 1
        effects:
          - { type: touchLead, chance: 0.2 }
      - id: wait
        label: Wait
        hours: 0

  - id: food_fair
    area: sales
    weight: 1
    once: true
    when: [week >= 4, cashEur >= 3000]
    from: none
    sender: Trade fair
    text: >-
      A food tech fair offers a booth for 1,350 EUR. Visitors will mostly be caterers. You do sell
      lunch software, so it is technically relevant.
    defaultChoice: pass
    choices:
      - id: booth
        label: Take the booth
        hours: 8
        effects:
          - { type: cash, amountCents: -135000 }
          - { type: newLeads, count: 3 }
          - { type: energy, delta: -4 }
      - id: pass
        label: Pass
        hours: 0

  - id: sales_coach
    area: sales
    weight: 1
    once: true
    when: [week >= 3]
    from: none
    sender: Sales coach
    text: >-
      A sales coach offers a two hour crash course for 375 EUR. He uses the word synergy twice
      in the pitch for the course.
    defaultChoice: decline
    choices:
      - id: buy
        label: Book the course
        hours: 2
        effects:
          - { type: cash, amountCents: -37500 }
          - { type: skill, skill: selling, delta: 0.01 }
      - id: decline
        label: Decline
        hours: 0

  - id: integration_question
    area: sales
    weight: 2
    when: [leads.waitingForDemo >= 1]
    from: lead
    sender: Prospect
    text: >-
      {name} asks whether Kantino can connect to their cafeteria system. You have no idea what
      that system is. They sound confident that you do.
    defaultChoice: ignore
    choices:
      - id: promise
        label: Say yes and work it out later
        hours: 3
        effects:
          - { type: touchLead }
          - { type: bugs, delta: 2 }
          - { type: lostHours, hours: 3 }
      - id: honest
        label: Be honest about it
        hours: 1
        effects:
          - { type: touchLead }
          - { type: skill, skill: selling, delta: 0.01 }
      - id: ignore
        label: Do not answer yet
        hours: 0

  - id: competitor_launch
    area: sales
    weight: 1
    once: true
    when: [week >= 6]
    from: none
    sender: Newsletter
    text: >-
      A competitor has launched a lunch app. The screenshots are impressive. The sign up page
      returns an error.
    defaultChoice: ignore
    choices:
      - id: study
        label: Study it properly
        hours: 3
        effects:
          - { type: energy, delta: -3 }
      - id: ignore
        label: Ignore it
        hours: 0

  # ---- product ----
  - id: crash_report
    area: product
    weight: 3
    when: [customers.count >= 1, bugs >= 2]
    from: customer
    sender: Customer
    text: >-
      {name} reports that the daily order failed twice this week. One lunch went to the wrong
      floor. Nobody is happy about the lunch or about you.
    defaultChoice: nothing
    choices:
      - id: patch
        label: Drop everything and patch it
        hours: 4
        effects:
          - { type: bugs, delta: -1 }
      - id: apologise
        label: Send a careful apology
        hours: 1
        effects:
          - { type: churnChance, delta: 0.05 }
      - id: nothing
        label: Do nothing
        hours: 0
        effects:
          - { type: churnChance, delta: 0.1 }

  - id: restaurant_portal
    area: product
    weight: 2
    when: [week >= 3]
    from: none
    sender: Restaurant owner
    text: >-
      A restaurant owner suggests you build a portal for restaurants. He would use it. He is also
      the only one who has asked.
    defaultChoice: decline
    choices:
      - id: promise
        label: Promise to look into it
        hours: 0
        effects:
          - { type: lostHours, hours: 6 }
      - id: chat
        label: Hear him out
        hours: 2
        effects:
          - { type: lostHours, hours: 3 }
      - id: decline
        label: Decline politely
        hours: 0

  - id: security_notice
    area: product
    weight: 2
    when: [features.shipped >= 1]
    from: none
    sender: Forum thread
    text: >-
      A forum thread says a library you rely on has a security notice. Fixing it takes an
      afternoon. Not fixing it takes longer, later.
    defaultChoice: ignore
    choices:
      - id: patch
        label: Patch it now
        hours: 4
      - id: ignore
        label: Read it again tomorrow
        hours: 0
        effects:
          - { type: bugs, delta: 2 }

  - id: hosting_pricing
    area: product
    weight: 1
    once: true
    when: [week >= 3]
    from: none
    sender: Hosting provider
    text: >-
      Your hosting provider has changed its pricing. The new price is higher. The old plan is now
      described as "legacy".
    defaultChoice: accept
    choices:
      - id: migrate
        label: Migrate it yourself
        hours: 6
      - id: accept
        label: Accept the new price
        hours: 0
        effects:
          - { type: fixedCost, id: hosting_upgrade, name: Hosting upgrade, monthlyCents: 3000 }

  # ---- finance ----
  - id: late_payer_first
    area: finance
    weight: 4
    once: true
    when: [customers.count >= 1, invoices.overdueDays >= 14]
    from: customer
    sender: Customer
    text: >-
      {name} has still not paid. Their accounts department has, they say, "a process". Nobody
      has been able to describe the process.
    defaultChoice: wait
    choices:
      - id: reminder
        label: Send a friendly reminder
        hours: 1
        effects:
          - { type: invoicePayChance, delta: 0.5 }
      - id: call
        label: Call their accounting team
        hours: 2
        effects:
          - { type: invoicePayChance, delta: 0.55 }
      - id: pause
        label: Pause their account
        hours: 0
        effects:
          - { type: invoicePayChance, delta: 0.6 }
          - { type: churnChance, delta: 0.35 }
      - id: wait
        label: Wait
        hours: 0

  - id: filing_deadline
    area: finance
    weight: 2
    once: true
    when: [week >= 4]
    from: none
    sender: Accountant
    text: >-
      Your accountant found a form that should have been filed last month. It is short and mildly
      urgent. The fee for filing it late is not short.
    defaultChoice: late
    choices:
      - id: file
        label: File it now
        hours: 2
      - id: late
        label: File it later
        hours: 0
        effects:
          - { type: cash, amountCents: -45000 }

  - id: regional_grant
    area: finance
    weight: 1
    once: true
    when: [week >= 2, cashEur <= 12000]
    from: none
    sender: Regional programme
    text: >-
      A regional programme offers startups a small grant. The application is nine pages long.
      Page six asks for your vision of the year 2035.
    defaultChoice: skip
    choices:
      - id: apply
        label: Apply
        hours: 5
        effects:
          - { type: cash, amountCents: 225000, chance: 0.5 }
      - id: skip
        label: Skip it
        hours: 0

  - id: laptop_fan
    area: finance
    weight: 1
    once: true
    when: [week >= 2]
    from: none
    sender: Your laptop
    text: >-
      The fan in your laptop now sounds like a small aircraft. A new laptop costs 2,100 EUR. The
      old one still technically works.
    defaultChoice: live_with_it
    choices:
      - id: buy
        label: Buy a new one
        hours: 1
        effects:
          - { type: cash, amountCents: -210000 }
      - id: live_with_it
        label: Live with it
        hours: 0
        effects:
          - { type: energy, delta: -4 }

  # The books arrive as a recurring message instead of a weekly chore.
  - id: receipts_pile
    area: finance
    weight: 3
    cooldownWeeks: 5
    when: [week >= 3]
    from: none
    sender: Accountant
    text: >-
      Your accountant would like the receipts for the last few weeks. Some are in a shoebox.
      One is on the back of a lunch menu.
    defaultChoice: later
    choices:
      - id: sort
        label: Sort them tonight
        hours: 3
      - id: send
        label: Pay the accountant to sort them
        hours: 0
        effects:
          - { type: cash, amountCents: -22500 }
      - id: later
        label: Later
        hours: 0
        effects:
          - { type: cash, amountCents: -60000, chance: 0.5 }
          - { type: lostHours, hours: 4, chance: 0.5 }

  - id: bank_fee
    area: finance
    weight: 1
    once: true
    when: [week >= 2]
    from: none
    sender: Bank
    text: >-
      The bank is introducing an account fee for accounts that are used. Yours is used. The letter
      is friendly about it.
    defaultChoice: accept
    choices:
      - id: switch
        label: Switch to an online bank
        hours: 3
      - id: accept
        label: Accept the fee
        hours: 0
        effects:
          - { type: fixedCost, id: bank_fee, name: Bank fee, monthlyCents: 1500 }

  # ---- founder ----
  - id: bad_sleep
    area: founder
    weight: 2
    when: [energy <= 60]
    from: none
    sender: Next door
    text: >-
      The neighbours are renovating again, starting at 6 am. You can now name drill models by
      sound.
    defaultChoice: push_through
    choices:
      - id: nap
        label: Take an afternoon nap
        hours: 3
        effects:
          - { type: energy, delta: 8 }
      - id: push_through
        label: Push through
        hours: 0
        effects:
          - { type: energy, delta: -5 }

  - id: family_lunch
    area: founder
    weight: 2
    when: [week >= 2]
    from: none
    sender: Family
    text: >-
      Your family has noticed that you now exist mostly as a voice on the phone. Sunday lunch is
      at one. Attendance is voluntary in the way tax is voluntary.
    defaultChoice: stay
    choices:
      - id: go
        label: Go
        hours: 4
        effects:
          - { type: energy, delta: 10 }
      - id: stay
        label: Stay at the desk
        hours: 0
        effects:
          - { type: energy, delta: -3 }

  - id: old_boss
    area: founder
    weight: 2
    once: true
    when: [week >= 8, cashEur <= 7500]
    from: none
    sender: Your old boss
    text: >-
      Your former boss writes. There is a job, a salary and a pension. He mentions the pension
      twice.
    defaultChoice: decline
    choices:
      - id: freelance
        label: Offer a few freelance days
        hours: 8
        effects:
          - { type: cash, amountCents: 300000, chance: 0.75 }
          - { type: energy, delta: -6 }
      - id: decline
        label: Decline politely
        hours: 0

  - id: flu
    area: founder
    weight: 1
    when: [week >= 3]
    from: none
    sender: Your body
    text: >-
      You have a cold. The company is a team of one, and the team is not feeling well.
    defaultChoice: work_through
    choices:
      - id: rest
        label: Rest properly
        hours: 5
        effects:
          - { type: energy, delta: 4 }
      - id: work_through
        label: Work through it
        hours: 0
        effects:
          - { type: energy, delta: -10 }

  # ---- team ----
  - id: team_plan
    area: team
    weight: 2
    when: [hasHire >= 1]
    from: none
    sender: Your hire
    text: >-
      Your hire politely asks whether there is a plan. They add that it would be nice if the plan
      were also written down somewhere.
    defaultChoice: wave_off
    choices:
      - id: session
        label: Run a planning session
        hours: 3
        effects:
          - { type: skill, skill: selling, delta: 0.01 }
      - id: wave_off
        label: Wave it off
        hours: 0
        effects:
          - { type: lostHours, hours: 3 }

  - id: raise_request
    area: team
    weight: 2
    once: true
    when: [hasHire >= 1, week >= 12]
    from: none
    sender: Your hire
    text: >-
      Your hire would like a raise. They have, to be fair, now worked for you for several
      weeks without a single dramatic exit.
    defaultChoice: decline
    choices:
      - id: give
        label: Give the raise
        hours: 0
        effects:
          - { type: fixedCost, id: raise, name: Raise, monthlyCents: 45000 }
      - id: decline
        label: Decline
        hours: 0
        effects:
          - { type: lostHours, hours: 4 }
