# Inbox events, team area. Text is 2 to 4 sentences. {name} is the customer or lead the
# message is from. Conditions: <path> <op> <number>, paths from CONDITION_PATHS in schema.ts. All
# must hold. Effects: closed set in schema.ts; an effect's own `when` makes it land only if its
# conditions hold when the week ends. Choices show their hours to the player, never their odds.
# An unanswered message takes its defaultChoice (which costs no hours) when it expires.
# look: letter (default), note for something personal, official for banks and offices.
# Every event is `once`, except those that recur on purpose, which set cooldownWeeks.
# `- shared: <id>` places an event from src/shared/events here: the draw walks the list in order.
events:
  - shared: team_plan
  - shared: raise_request
  - shared: second_monitor
  - shared: hire_holiday
  - shared: hire_idea
  - shared: hire_laptop
  - shared: hire_feedback

  - id: team_lunch
    area: team
    weight: 2
    once: true
    when: [hasHire >= 1, features.shipped >= 1]
    from: none
    sender: Your hire
    look: note
    text: >-
      Your hire suggests a team lunch, ordered through Kantino. It would be the first time the
      product has been used by its own team.
    defaultChoice: skip
    choices:
      - id: order
        label: Order lunch
        hours: 1
        effects:
          - { type: cash, amountCents: -4000 }
          - { type: bugs, delta: -1 }
      - id: skip
        label: Eat at your desks
        hours: 0

  - shared: recruiter_call
  - shared: design_tool
  - shared: office_question
