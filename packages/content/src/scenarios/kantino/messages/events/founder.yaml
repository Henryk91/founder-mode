# Inbox events, founder area. Text is 2 to 4 sentences. {name} is the customer or lead the
# message is from. Conditions: <path> <op> <number>, paths from CONDITION_PATHS in schema.ts. All
# must hold. Effects: closed set in schema.ts; an effect's own `when` makes it land only if its
# conditions hold when the week ends. Choices show their hours to the player, never their odds.
# An unanswered message takes its defaultChoice (which costs no hours) when it expires.
# look: letter (default), note for something personal, official for banks and offices.
# Every event is `once`, except those that recur on purpose, which set cooldownWeeks.
events:
  # The office stage move (spec section 9). It arrives for sure, once, from week 8 or after the
  # first paying customer, whichever comes first. Conditions are checked at the end of the week
  # before a message arrives, so `week >= 7` puts it on the desk in week 8. Its monthly cost and
  # effects are the stage's.
  - id: coworking_desk
    area: founder
    weight: 1
    once: true
    trigger: [week >= 7, customers.won >= 1]
    from: none
    sender: Werkraum Ost, coworking
    look: letter
    text: >-
      A desk by the window has come free at Werkraum Ost, 225 EUR a month. Proper chairs,
      coffee that someone else cleans up after, and forty people who might know an office
      manager. Your kitchen table would get its breakfasts back.
    defaultChoice: stay
    choices:
      - id: move
        label: Take the desk
        hours: 2
        effects:
          - { type: moveOffice, stage: coworking_desk }
      - id: stay
        label: Stay at the kitchen table
        hours: 0
        effects: []

  - id: bad_sleep
    area: founder
    weight: 2
    once: true
    when: [energy <= 60]
    from: none
    sender: Next door
    look: note
    text: >-
      The neighbours are renovating again, starting at 6 am. You can now name drill models by
      sound.
    defaultChoice: push_through
    choices:
      - id: nap
        label: Take an afternoon nap
        hours: 3
        effects:
          - { type: energy, delta: 8 }
      - id: push_through
        label: Push through
        hours: 0
        effects:
          - { type: energy, delta: -5 }

  - id: family_lunch
    area: founder
    weight: 2
    once: true
    when: [week >= 2]
    from: none
    sender: Family
    look: note
    text: >-
      Your family has noticed that you now exist mostly as a voice on the phone. Sunday lunch is
      at one. Attendance is voluntary in the way tax is voluntary.
    defaultChoice: stay
    choices:
      - id: go
        label: Go
        hours: 4
        effects:
          - { type: energy, delta: 10 }
      - id: stay
        label: Stay at the desk
        hours: 0
        effects:
          - { type: energy, delta: -3 }

  - id: old_boss
    area: founder
    weight: 2
    once: true
    when: [week >= 8, cashEur <= 7500]
    from: none
    sender: Your old boss
    look: note
    text: >-
      Your former boss writes. There is a job, a salary and a pension. He mentions the pension
      twice.
    defaultChoice: decline
    choices:
      - id: freelance
        label: Offer a few freelance days
        hours: 8
        effects:
          - { type: cash, amountCents: 300000, chance: 0.75 }
          - { type: energy, delta: -6 }
      - id: decline
        label: Decline politely
        hours: 0

  - id: flu
    area: founder
    weight: 1
    once: true
    when: [week >= 3]
    from: none
    sender: Your body
    look: note
    text: >-
      You have a cold. The company is a team of one, and the team is not feeling well.
    defaultChoice: work_through
    choices:
      - id: rest
        label: Rest properly
        hours: 5
        effects:
          - { type: energy, delta: 4 }
      - id: work_through
        label: Work through it
        hours: 0
        effects:
          - { type: energy, delta: -10 }

  - id: ten_k_run
    area: founder
    weight: 2
    once: true
    when: [week >= 4]
    from: none
    sender: An old friend
    look: note
    text: >-
      A friend has signed you both up for a 10 km run in six weeks. They already paid the fee,
      which feels like a tactic.
    defaultChoice: back_out
    choices:
      - id: train
        label: Start training
        hours: 3
        effects:
          - { type: energy, delta: 6 }
      - id: back_out
        label: Develop a sudden knee problem
        hours: 0

  - id: birthday_party
    area: founder
    weight: 2
    once: true
    when: [week >= 2]
    from: none
    sender: An old friend
    look: note
    text: >-
      An old friend turns 40 on Saturday. There will be a speech, and you are apparently in it.
    defaultChoice: card
    choices:
      - id: go
        label: Go to the party
        hours: 4
        effects:
          - { type: energy, delta: 8 }
      - id: card
        label: Send a card
        hours: 0
        effects:
          - { type: energy, delta: -2 }

  - id: dentist
    area: founder
    weight: 2
    once: true
    when: [week >= 4]
    from: none
    sender: Dental practice
    text: >-
      Your dentist has sent a third reminder. The tone has moved from friendly to clinical.
    defaultChoice: postpone
    choices:
      - id: go
        label: Book the appointment
        hours: 2
      - id: postpone
        label: Postpone again
        hours: 0
        effects:
          - { type: energy, delta: -6, chance: 0.3 }
          - { type: lostHours, hours: 4, chance: 0.3 }

  - id: four_am_idea
    area: founder
    weight: 2
    once: true
    when: [week >= 3]
    from: none
    sender: Your brain
    look: note
    text: >-
      You wake at four with a brilliant idea. By seven it is less brilliant, and you are more
      tired.
    defaultChoice: get_up
    choices:
      - id: sleep_in
        label: Sleep in
        hours: 3
        effects:
          - { type: energy, delta: 6 }
      - id: get_up
        label: Get up anyway
        hours: 0
        effects:
          - { type: energy, delta: -4 }

  - id: lake_weekend
    area: founder
    weight: 2
    once: true
    when: [week >= 8]
    from: none
    sender: Friends
    look: note
    text: >-
      Friends have rented a house by a lake for a long weekend. There is no wifi, which they
      list as a feature. It would do wonders if you are running on fumes.
    defaultChoice: stay
    choices:
      - id: go
        label: Go to the lake
        hours: 6
        effects:
          - { type: energy, delta: 15 }
      - id: stay
        label: Stay and work
        hours: 0

  - id: sister_dinner
    area: founder
    weight: 2
    once: true
    when: [week >= 3]
    from: none
    sender: Your sister
    look: note
    text: >-
      Your sister has booked a table for Friday. She said the word "phone" in a meaningful way.
    defaultChoice: reschedule
    choices:
      - id: go
        label: Go, phone in the coat
        hours: 3
        effects:
          - { type: energy, delta: 6 }
      - id: reschedule
        label: Ask to reschedule
        hours: 0
        effects:
          - { type: energy, delta: -3 }

  - id: coffee_machine
    area: founder
    weight: 2
    once: true
    when: [week >= 2]
    from: none
    sender: Your kitchen
    look: note
    text: >-
      Your coffee machine has died. A new one costs 150 EUR. The café downstairs is cheaper per
      cup, and costs a short walk every time.
    defaultChoice: cafe
    choices:
      - id: buy
        label: Buy a new machine
        hours: 1
        effects:
          - { type: cash, amountCents: -15000 }
      - id: cafe
        label: Use the café
        hours: 0
        effects:
          - { type: lostHours, hours: 2 }

  - id: mentor_offer
    area: founder
    weight: 2
    once: true
    when: [week >= 4]
    from: none
    sender: Retired founder
    text: >-
      A retired founder offers you an hour of mentoring a week. She sold her company in 2009 and
      talks about the sale the way other people talk about holidays. Her advice is mostly about
      selling.
    defaultChoice: decline
    choices:
      - id: accept
        label: Accept
        hours: 3
        effects:
          - { type: skill, skill: selling, delta: 0.02 }
      - id: decline
        label: Decline with thanks
        hours: 0

  - id: burnout_article
    area: founder
    weight: 2
    once: true
    when: [energy <= 50]
    from: none
    sender: A friend
    look: note
    text: >-
      A friend sends you an article about founder burnout. You read it at midnight, which feels
      like it misses the point.
    defaultChoice: keep_going
    choices:
      - id: day_off
        label: Take a day off
        hours: 6
        effects:
          - { type: energy, delta: 12 }
      - id: keep_going
        label: Keep going
        hours: 0
        effects:
          - { type: energy, delta: -3 }

  - id: cracked_phone
    area: founder
    weight: 2
    once: true
    when: [week >= 3]
    from: none
    sender: Your phone
    look: note
    text: >-
      Your phone screen cracked on the way to a demo. It still works, mostly in the top half.
    defaultChoice: live_with_it
    choices:
      - id: repair
        label: Get it repaired
        hours: 1
        effects:
          - { type: cash, amountCents: -12000 }
      - id: live_with_it
        label: Live with it
        hours: 0
        effects:
          - { type: energy, delta: -2 }

  - id: parents_visit
    area: founder
    weight: 2
    once: true
    when: [week >= 5]
    from: none
    sender: Your parents
    look: note
    text: >-
      Your parents are in town and would like to see "the office". The office is your kitchen
      table, and they have sat at it before.
    defaultChoice: postpone
    choices:
      - id: day
        label: Spend the day with them
        hours: 5
        effects:
          - { type: energy, delta: 8 }
      - id: coffee
        label: Meet for coffee
        hours: 1
        effects:
          - { type: energy, delta: 2 }
      - id: postpone
        label: Ask them to come back later
        hours: 0
        effects:
          - { type: energy, delta: -3 }

  - id: personal_tax
    area: founder
    weight: 2
    once: true
    when: [week >= 8]
    from: none
    sender: Tax office
    look: official
    text: >-
      Your personal tax return is due. Last year it took an afternoon. Last year you had a
      salary and one source of receipts.
    defaultChoice: extension
    choices:
      - id: file
        label: Do it this week
        hours: 3
      - id: extension
        label: Ask for an extension
        hours: 0
        effects:
          - { type: lostHours, hours: 4, chance: 0.5 }

  - id: back_pain
    area: founder
    weight: 2
    once: true
    when: [week >= 6]
    from: none
    sender: Your back
    look: note
    text: >-
      Your back has opinions about your chair. A physiotherapist has an opening on Tuesday,
      which helps most if you are already worn down.
    defaultChoice: stretch
    choices:
      - id: physio
        label: Book the physiotherapist
        hours: 2
        effects:
          - { type: energy, delta: 8, when: [energy <= 60] }
          - { type: energy, delta: 2, when: [energy > 60] }
      - id: stretch
        label: Stretch at the desk
        hours: 0
        effects:
          - { type: energy, delta: -3 }

  - id: founder_dinner
    area: founder
    weight: 2
    once: true
    when: [week >= 5]
    from: none
    sender: Founder group
    text: >-
      A group of founders meets once a month to complain in a structured way. They have a
      spare seat on Thursday. One of them runs an office of forty people, if you are short of
      leads.
    defaultChoice: skip
    choices:
      - id: go
        label: Take the seat
        hours: 3
        effects:
          - { type: energy, delta: 4 }
          - { type: newLeads, count: 1, chance: 0.4, when: [leads.open <= 8] }
      - id: skip
        label: Skip it
        hours: 0
