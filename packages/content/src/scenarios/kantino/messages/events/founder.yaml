# Inbox events, founder area. Text is 2 to 4 sentences. {name} is the customer or lead the
# message is from. Conditions: <path> <op> <number>, paths from CONDITION_PATHS in schema.ts. All
# must hold. Effects: closed set in schema.ts; an effect's own `when` makes it land only if its
# conditions hold when the week ends. Choices show their hours to the player, never their odds.
# An unanswered message takes its defaultChoice (which costs no hours) when it expires.
# look: letter (default), note for something personal, official for banks and offices.
# Every event is `once`, except those that recur on purpose, which set cooldownWeeks.
# `- shared: <id>` places an event from src/shared/events here: the draw walks the list in order.
events:
  # The office stage move (spec section 9). It arrives for sure, once, from week 8 or after the
  # first paying customer, whichever comes first. Conditions are checked at the end of the week
  # before a message arrives, so `week >= 7` puts it on the desk in week 8. Its monthly cost and
  # walk-in leads are the stage's (scenario.yaml, officeStages).
  - id: coworking_desk
    area: founder
    weight: 1
    once: true
    trigger: [week >= 7, customers.won >= 1]
    from: none
    sender: Werkraum Ost, coworking
    look: letter
    text: >-
      A desk by the window has come free at Werkraum Ost, 375 EUR a month. The manager knows
      half the coworking spaces in town and says they all argue about lunch. If coworking spaces
      are your market, that is a steady stream of introductions. If not, it is an expensive chair.
    defaultChoice: stay
    choices:
      - id: move
        label: Take the desk
        hours: 2
        effects:
          - { type: moveOffice, stage: coworking_desk }
      - id: stay
        label: Stay at the kitchen table
        hours: 0
        effects: []

  - shared: bad_sleep

  - id: family_lunch
    area: founder
    weight: 2
    once: true
    when: [week >= 2]
    from: none
    sender: Family
    look: note
    text: >-
      Your family has noticed that you now exist mostly as a voice on the phone. Sunday lunch is
      at one. Attendance is voluntary in the way tax is voluntary.
    defaultChoice: stay
    choices:
      - id: go
        label: Go
        hours: 4
        effects:
          - { type: energy, delta: 10 }
      - id: stay
        label: Stay at the desk
        hours: 0
        effects:
          - { type: energy, delta: -3 }

  - shared: old_boss
  - shared: flu
  - shared: ten_k_run
  - shared: birthday_party
  - shared: dentist
  - shared: four_am_idea
  - shared: lake_weekend
  - shared: sister_dinner
  - shared: coffee_machine
  - shared: mentor_offer
  - shared: burnout_article
  - shared: cracked_phone
  - shared: parents_visit
  - shared: personal_tax
  - shared: back_pain

  - id: founder_dinner
    area: founder
    weight: 2
    once: true
    when: [week >= 5]
    from: none
    sender: Founder group
    text: >-
      A group of founders meets once a month to complain in a structured way. They have a
      spare seat on Thursday. One of them runs an office of forty people, if you are short of
      leads.
    defaultChoice: skip
    choices:
      - id: go
        label: Take the seat
        hours: 3
        effects:
          - { type: energy, delta: 4 }
          - { type: newLeads, count: 1, chance: 0.4, when: [leads.open <= 8] }
      - id: skip
        label: Skip it
        hours: 0
