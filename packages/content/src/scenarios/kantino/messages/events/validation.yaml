# Inbox events, validation area. Text is 2 to 4 sentences. {name} is the customer or lead the
# message is from. Conditions: <path> <op> <number>, paths from CONDITION_PATHS in schema.ts. All
# must hold. Effects: closed set in schema.ts; an effect's own `when` makes it land only if its
# conditions hold when the week ends. Choices show their hours to the player, never their odds.
# An unanswered message takes its defaultChoice (which costs no hours) when it expires.
# look: letter (default), note for something personal, official for banks and offices.
# Every event is `once`, except those that recur on purpose, which set cooldownWeeks.
# `- shared: <id>` places an event from src/shared/events here: the draw walks the list in order.
events:
  - id: survey_offer
    area: validation
    weight: 2
    once: true
    when: [week >= 1]
    from: none
    sender: Panel firm
    text: >-
      A market research firm offers to survey 200 office managers for 600 EUR. The sample is
      large. The questions are theirs.
    defaultChoice: pass
    choices:
      - id: buy
        label: Buy the survey
        hours: 1
        effects:
          - { type: cash, amountCents: -60000 }
          - { type: skill, skill: interviewing, delta: 0.03 }
      - id: pass
        label: Pass
        hours: 0

  - id: friend_of_friend
    area: validation
    weight: 2
    once: true
    when: [week >= 1]
    from: none
    sender: A friend of a friend
    look: note
    text: >-
      A friend's friend runs an office and offers a free chat about lunch. They are very
      supportive. They would be supportive of anything.
    defaultChoice: decline
    choices:
      - id: call
        label: Take the call
        hours: 2
        effects:
          - { type: lostHours, hours: 2 }
      - id: decline
        label: Politely decline
        hours: 0

  - shared: startup_meetup

  - id: student_thesis
    area: validation
    weight: 2
    once: true
    when: [week >= 2]
    from: none
    sender: Business student
    text: >-
      A business student wants to write a thesis about Kantino and needs four hours of your
      time. In return you get a chapter on your market. It will be finished in 2028.
    defaultChoice: decline
    choices:
      - id: help
        label: Give the interviews
        hours: 4
        effects:
          - { type: skill, skill: interviewing, delta: 0.02 }
      - id: decline
        label: Wish them luck
        hours: 0

  - id: office_manager_forum
    area: validation
    weight: 2
    once: true
    when: [week >= 2]
    from: none
    sender: Forum digest
    text: >-
      A forum for office managers has a thread called "Lunch is ruining my week". It has 140
      replies, about six of them about lunch. Joining in means answering messages for days.
    defaultChoice: skip
    choices:
      - id: post
        label: Join the thread
        hours: 2
        effects:
          - { type: newLeads, count: 1, chance: 0.5, when: [leads.open <= 8] }
          - { type: lostHours, hours: 2, when: [leads.open > 8] }
      - id: lurk
        label: Read the six
        hours: 1
        effects:
          - { type: skill, skill: interviewing, delta: 0.01 }
      - id: skip
        label: Close the tab
        hours: 0

  - id: lunch_diary
    area: validation
    weight: 2
    once: true
    when: [week >= 1]
    from: none
    sender: Office manager
    text: >-
      An office manager you interviewed offers to keep a lunch diary for a week. She warns you
      it will mostly say "sandwich".
    defaultChoice: decline
    choices:
      - id: accept
        label: Ask for the diary
        hours: 1
        effects:
          - { type: skill, skill: interviewing, delta: 0.02 }
      - id: decline
        label: Thank her anyway
        hours: 0

  - shared: visitor_list

  - id: university_pilot
    area: validation
    weight: 2
    once: true
    when: [week >= 4]
    from: none
    sender: University canteen
    text: >-
      A university canteen project wants to pilot Kantino with 40 staff, unpaid, for research.
      A first reference opens doors. A third reference mostly opens a spreadsheet.
    defaultChoice: decline
    choices:
      - id: pilot
        label: Run the pilot
        hours: 5
        effects:
          - { type: newLeads, count: 2, when: [customers.count <= 1] }
          - { type: lostHours, hours: 3, when: [customers.count >= 2] }
      - id: decline
        label: Decline
        hours: 0

  - id: rival_customer
    area: validation
    weight: 2
    once: true
    when: [week >= 3]
    from: none
    sender: Office manager
    text: >-
      An office manager left a rival lunch tool after three weeks and would happily explain why
      over coffee. At length. With slides, if you let her.
    defaultChoice: skip
    choices:
      - id: coffee
        label: Buy her a coffee
        hours: 2
        effects:
          - { type: newLeads, count: 1, chance: 0.4 }
          - { type: skill, skill: interviewing, delta: 0.01 }
      - id: skip
        label: Skip it
        hours: 0

  - id: focus_group
    area: validation
    weight: 1
    once: true
    when: [week >= 2]
    from: none
    sender: Research agency
    text: >-
      An agency offers a focus group of eight office managers for 900 EUR, sandwiches included.
      The sandwiches come from a rival caterer, and you will have to watch them being enjoyed.
    defaultChoice: pass
    choices:
      - id: book
        label: Book it
        hours: 3
        effects:
          - { type: cash, amountCents: -90000 }
          - { type: skill, skill: interviewing, delta: 0.03 }
      - id: pass
        label: Pass
        hours: 0

  - id: online_poll
    area: validation
    weight: 2
    once: true
    when: [week >= 2]
    from: none
    sender: Social network
    text: >-
      Your poll about office lunches got 312 votes. 290 of them came from recruiters. One
      recruiter has asked whether you are open to new opportunities.
    defaultChoice: ignore
    choices:
      - id: analyse
        label: Go through the votes
        hours: 2
      - id: ignore
        label: Let it scroll away
        hours: 0

  - shared: podcast_invite

  - id: tenant_survey
    area: validation
    weight: 2
    once: true
    when: [week >= 3]
    from: none
    sender: Property firm
    text: >-
      A property firm is surveying its office tenants and will add two questions of yours for
      400 EUR. The other questions are about the lifts.
    defaultChoice: pass
    choices:
      - id: buy
        label: Add the questions
        hours: 1
        effects:
          - { type: cash, amountCents: -40000 }
          - { type: newLeads, count: 1, chance: 0.5 }
      - id: pass
        label: Pass
        hours: 0

  - id: catering_inquiry
    area: validation
    weight: 2
    once: true
    when: [week >= 2]
    from: none
    sender: Catering company
    text: >-
      A catering company asks whether Kantino works for catering companies. It does not. They
      are keen anyway and would like a call to discuss it.
    defaultChoice: decline
    choices:
      - id: call
        label: Take the call
        hours: 2
        effects:
          - { type: lostHours, hours: 2 }
      - id: decline
        label: Explain and decline
        hours: 0

  - id: expert_interview
    area: validation
    weight: 2
    once: true
    when: [week >= 1, week <= 12]
    from: none
    sender: Facilities consultant
    text: >-
      A facilities consultant who has fitted out 60 office kitchens offers an hour of her time.
      Before your first customer, that is an hour of priceless context. After it, it is an hour.
    defaultChoice: decline
    choices:
      - id: meet
        label: Meet her
        hours: 2
        effects:
          - { type: skill, skill: interviewing, delta: 0.03, when: [customers.count == 0] }
          - { type: skill, skill: selling, delta: 0.02, when: [customers.count == 0] }
      - id: decline
        label: Decline
        hours: 0
