# Onboarding text shown before week 1, and the founder's notes shown in weeks 1 to 4.
# Placeholders: {name} is a plain number, {name:eur} is cents shown as euros.
# Intro cards may use cash, savings, living, maxWeeks. Notes may use week, n, living.
# Nothing here may reveal which segment is viable.
intro:
  cards:
    - id: you
      title: You
      body: >-
        You are a founder in Munich. The company account holds {cash:eur}, your savings hold
        {savings:eur}, and staying alive costs {living:eur} a week. No staff, no customers,
        plenty of opinions.
    - id: idea
      title: The idea
      body: >-
        Kantino is software that lets a workplace place one shared lunch order, instead of a
        group chat and a spreadsheet. It does not exist yet. You have an idea and a laptop.
    - id: problem
      title: The problem
      body: >-
        Three kinds of customer might want it: small offices, coworking spaces and medical
        practices. Some of them need it badly, some will say yes and never pay, and they will
        all be polite about it. You cannot tell which from here.
    - id: goal
      title: The goal
      body: >-
        Last {maxWeeks} weeks. To win, the company has to pay for itself and for you, with
        customer money covering all costs for the last two months. Run out of money, yours
        included, and it is over.

# Chosen by simple rules from the current state, weeks 1 to 4 only. They describe, never advise.
founderNotes:
  first_week: >-
    Week 1. No customers, no product, no evidence about any of the three markets. Every choice
    this week is a guess, and some guesses cost more than others.
  no_evidence: >-
    Week {week}. Still no evidence about any market. Your savings pay {living:eur} a week
    whatever you do.
  only_interviews: >-
    You have {n} interviews behind you. What people say is not the same as what they pay for.
  built_unseen: >-
    Something is built and nobody outside knows about it. Products tend not to sell themselves.
  leads_only: >-
    You have {n} leads. A lead is interest, not income.
