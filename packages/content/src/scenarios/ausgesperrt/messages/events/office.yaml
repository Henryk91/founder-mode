events:
  - id: finish_reception
    area: finance
    weight: 2
    once: false
    cooldownWeeks: 12
    trigger: [tour.turnedAwayWeeks >= 3]
    when:
      - week >= 26
      - office.stage == 1
      - months.coveringAll >= 2
    from: none
    sender: Your fit-out contractor
    look: official
    text: >-
      The reception can stop looking like a building site: 8,000 EUR now and 500 EUR a month.
      Once groups are being turned away regularly, a proper briefing area brings chairs,
      lighting and somewhere for coats. The quote includes everything except the coats.
    defaultChoice: stay
    choices:
      - id: move
        label: Finish the reception
        hours: 4
        effects:
          - type: officeMove
            stage: finished_basement
      - id: stay
        label: Keep the present desk
        hours: 0
        effects: []
