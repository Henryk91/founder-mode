events:
  - id: 'school_morning'
    area: 'sales'
    weight: 2
    once: false
    cooldownWeeks: 18
    when:
      - 'leisure.open == 1'
    from: 'none'
    sender: 'The organiser'
    look: 'letter'
    text: 'A teacher wants to circulate your school-game leaflet to several classes. The detective badges have already been ordered. In peak months, ask existing guests for feedback with clear visit notes; in the off season, paid invitations help if no slot was packed last week. The campaign costs EUR300; promoting already packed slots invites complaints.'
    defaultChoice: 'leave'
    choices:
      - id: 'act'
        label: 'Send visit notes and request feedback'
        hours: 2
        effects:
          - type: 'review'
            rating: 4.5
            count: 3
            when:
              - 'tour.peak == 1'
              - 'tour.reviews >= 1'
      - id: 'more'
        label: 'Buy the invitation mailing'
        hours: 5
        effects:
          - type: 'guests'
            segment: 'locals'
            count: 12
            when:
              - 'tour.peak == 0'
              - 'leisure.packed == 0'
          - type: 'review'
            rating: 2
            count: 3
            when:
              - 'leisure.packed >= 1'
          - type: 'cash'
            amountCents: -30000
      - id: 'leave'
        label: 'Keep the existing invitations and budget'
        hours: 0
        effects: []
