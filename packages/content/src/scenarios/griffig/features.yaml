- id: basic_fit_out
  name: Reception, mats and changing rooms
  buildHours: 40
  bugsOnShip:
    min: 0
    max: 1
  mention: A safe floor, working changing rooms and a reception that knows who is inside.
- id: boulder_area
  name: Bouldering area
  buildHours: 30
  bugsOnShip:
    min: 0
    max: 0
  mention: Fresh boulders we can try together after lectures, with room to land.
- id: rope_walls
  name: Rope walls
  buildHours: 40
  bugsOnShip:
    min: 0
    max: 0
  mention: Proper rope routes, useful grades and enough space to train with a partner.
- id: auto_belays
  name: Auto-belay lines
  buildHours: 10
  bugsOnShip:
    min: 0
    max: 0
  mention: A way to climb without finding a partner, after a proper induction.
- id: kids_area
  name: Children’s bouldering area
  buildHours: 15
  bugsOnShip:
    min: 0
    max: 0
  mention: Somewhere the children can learn without running through adult training.
- id: training_area
  name: Training boards and equipment
  buildHours: 10
  bugsOnShip:
    min: 0
    max: 0
  mention: A useful training corner. I would rather have that than a larger reception sofa.
- id: cafe_counter
  name: Café counter
  buildHours: 15
  bugsOnShip:
    min: 0
    max: 0
  mention: A coffee after climbing is welcome. It does not replace the climbing.
