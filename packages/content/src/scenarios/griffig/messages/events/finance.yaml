events:
  - id: the_roof_drip
    area: finance
    weight: 1
    once: false
    cooldownWeeks: 18
    when:
      - leisure.open == 1
    from: none
    sender: Your hall notebook
    look: note
    text: Water falls near the rope wall after heavy rain. The landlord asks for photographs and the
      duty manager asks for a barrier. The wall does not need another kind of hold. Use the weekly
      wall,access and staff controls for lasting changes;this follow-up pays for the conversation
      and immediate cover.
    defaultChoice: leave
    choices:
      - id: act
        label: Close the affected section and arrange repair
        hours: 2
        effects:
          - type: cash
            amountCents: -15000
      - id: leave
        label: Put out a bucket and keep access
        hours: 0
        effects:
          - type: energy
            delta: -2
  - id: the_incident_report
    area: finance
    weight: 1
    once: false
    cooldownWeeks: 18
    when:
      - leisure.open == 1
    from: none
    sender: Your hall notebook
    look: note
    text:
      A child lands badly and needs medical attention. The family wants help and the insurer wants a
      factual report. Guessing the cause will not improve either conversation. Use the weekly
      wall,access and staff controls for lasting changes;this follow-up pays for the conversation
      and immediate cover.
    defaultChoice: leave
    choices:
      - id: act
        label: Follow the incident procedure
        hours: 2
        effects:
          - type: cash
            amountCents: -15000
      - id: leave
        label: Send a voucher before documenting anything
        hours: 0
        effects:
          - type: energy
            delta: -2
