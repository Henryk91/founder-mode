events:
  - id: the_first_belay_course
    area: team
    weight: 1
    once: false
    cooldownWeeks: 18
    when:
      - leisure.open == 1
    from: none
    sender: Your hall notebook
    look: note
    text:
      Several beginners want rope access after watching their friends. A course place is available,
      but independent access needs demonstrated skills. Enthusiasm has not completed the assessment.
      Use the weekly wall,access and staff controls for lasting changes;this follow-up pays for the
      conversation and immediate cover.
    defaultChoice: leave
    choices:
      - id: act
        label: Offer the proper course
        hours: 2
        effects:
          - type: cash
            amountCents: -12000
          - type: review
            rating: 5
            count: 1
      - id: leave
        label: Promise uncoached rope access immediately
        hours: 0
        effects:
          - type: review
            rating: 3
            count: 1
