events:
  - id: first_snow
    area: sales
    weight: 1
    once: false
    cooldownWeeks: 18
    when:
      - leisure.open == 1
    from: none
    sender: Your hall notebook
    look: note
    text: Outdoor climbers come back indoors on the same wet evening. The hall looks successful from
      reception and crowded from the mats. Members ask whether next Tuesday will be similar. Use the
      weekly wall,access and staff controls for lasting changes;this follow-up pays for the
      conversation and immediate cover.
    defaultChoice: leave
    choices:
      - id: act
        label: Review busy-slot access
        hours: 2
        effects:
          - type: guests
            segment: students
            count: 3
      - id: leave
        label: Sell every available visit
        hours: 0
        effects:
          - type: review
            rating: 3
            count: 1
