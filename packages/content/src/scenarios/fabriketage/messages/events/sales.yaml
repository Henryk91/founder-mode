events:
  - id: 'three_saturdays'
    area: 'sales'
    weight: 2
    once: false
    cooldownWeeks: 18
    when:
      - 'leisure.open == 1'
    from: 'none'
    sender: 'The organiser'
    look: 'letter'
    text: 'A wedding planner offers a mailing to three couples and asks for clear arrival information for booked clients. Their parents have requested a separate version. In peak months, ask existing guests for feedback with clear visit notes; in the off season, paid invitations help if no slot was packed last week. The campaign costs EUR600; promoting already packed slots invites complaints.'
    defaultChoice: 'leave'
    choices:
      - id: 'act'
        label: 'Send visit notes and request feedback'
        hours: 2
        effects:
          - type: 'review'
            rating: 4.5
            count: 3
            when:
              - 'tour.peak == 1'
              - 'tour.reviews >= 1'
      - id: 'more'
        label: 'Buy the invitation mailing'
        hours: 5
        effects:
          - type: 'guests'
            segment: 'weddings'
            count: 3
            when:
              - 'tour.peak == 0'
              - 'leisure.packed == 0'
          - type: 'review'
            rating: 2
            count: 3
            when:
              - 'leisure.packed >= 1'
          - type: 'cash'
            amountCents: -60000
      - id: 'leave'
        label: 'Keep the existing invitations and budget'
        hours: 0
        effects: []
